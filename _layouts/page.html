---
layout: default
---
<section class="page-hero container">
  {%- if page.sur_titre %}<p class="badge">{{ page.sur_titre }}</p>{% endif %}
  <h1 class="sr-only">{{ page.plaque | default: page.title }}</h1>
  <div class="plaque plaque--page" data-plaque="{{ page.plaque | default: page.title }}" aria-hidden="true"></div>
  {%- if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
</section>
<div class="container">
  {{ content }}
</div>
