<title>Galvez Martin en mosaïque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Une seule scène : un mur orange, le nom en wildstyle fait de 120 éclats de mosaïque. */
  :root {
    --wall: #e8925a;
    --panel: rgba(24, 16, 30, .8);
    --panel-ink: #f6f1ea;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--wall); color: var(--panel-ink); font-family: var(--ui); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 6px; border-radius: 14px;
  }
  .controls button {
    font: 600 14px/1 var(--ui); color: var(--panel-ink); background: transparent; border: 0; cursor: pointer;
    padding: 10px 16px; border-radius: 9px; white-space: nowrap;
  }
  .controls button:hover { background: rgba(255, 255, 255, .12); }
  .controls button:focus-visible { outline: 2px solid var(--panel-ink); outline-offset: 1px; }
</style>

<canvas id="mur" role="img" aria-label="Galvez Martin, écrit en wildstyle avec 120 éclats de mosaïque"></canvas>
<div class="controls"><button type="button" id="rejouer">↻ Rejouer</button></div>

<script>
(function () {
  'use strict';

  /* ---------- Couleurs, tirées du mur de référence ---------- */
  var WALL = '#e8925a';
  var INKS = ['#0d0b14', '#0d0b14', '#0d0b14', '#120e22', '#1e1640', '#2d1b5e', '#2b2a35'];
  var RIM = '#fbf6f1';

  /* ---------- Lettres : 1 à 3 éclats chacune (triangles ou quadrilatères) ----------
     Hauteur de capitale = 1, y vers le bas. Les éclats d'une lettre se touchent
     bord à bord ; le joint entre eux laisse voir le mur. */
  var LETTERS = {
    G: { w: 0.95, s: [
      [[-0.14, -0.16], [0.27, 0.0], [0.27, 1.0], [0.0, 0.96]],          // fût avec pointe
      [[0.27, 0.0], [0.97, -0.07], [0.82, 0.2], [0.27, 0.2]],           // barre du haut
      [[0.27, 0.8], [0.97, 0.42], [0.92, 1.02], [0.27, 1.0]]            // pied qui remonte
    ] },
    A: { w: 1.0, s: [
      [[-0.12, 1.08], [0.32, 0.0], [0.5, 0.0], [0.3, 1.0]],
      [[0.5, 0.0], [0.72, -0.05], [1.04, 1.0], [0.72, 1.0]],
      [[0.39, 0.55], [0.621, 0.55], [0.6584, 0.72], [0.356, 0.72]]     // barre, calée entre les jambes
    ] },
    L: { w: 0.8, s: [
      [[0.0, 0.08], [0.27, -0.12], [0.27, 0.78], [0.0, 0.78]],
      [[0.0, 0.78], [0.62, 0.78], [0.94, 1.06], [0.0, 1.0]]
    ] },
    V: { w: 0.96, s: [
      [[-0.12, -0.16], [0.27, 0.0], [0.5, 0.72], [0.46, 1.04]],
      [[0.66, 0.0], [0.97, -0.06], [0.46, 1.04], [0.5, 0.72]]
    ] },
    E: { w: 0.88, s: [
      [[0.0, 0.0], [0.86, -0.05], [0.72, 0.2], [0.0, 0.2]],
      [[0.0, 0.2], [0.28, 0.2], [0.64, 0.5], [0.0, 0.8]],               // fût + flèche du milieu
      [[0.0, 0.8], [0.72, 0.8], [0.9, 1.03], [0.0, 1.0]]
    ] },
    Z: { w: 0.92, s: [
      [[-0.16, -0.12], [0.9, 0.0], [0.86, 0.2], [0.0, 0.2]],
      [[0.6, 0.2], [0.86, 0.2], [0.3, 0.8], [0.04, 0.8]],
      [[0.0, 0.8], [0.88, 0.8], [1.0, 1.05], [0.0, 1.0]]
    ] },
    M: { w: 1.16, s: [
      [[-0.06, -0.18], [0.25, 0.0], [0.25, 1.0], [0.0, 1.04]],
      [[0.25, 0.0], [0.9, 0.0], [0.575, 0.74]],                         // le V du milieu
      [[0.9, 0.0], [1.22, -0.18], [1.15, 1.04], [0.9, 1.0]]
    ] },
    R: { w: 0.98, s: [
      [[0.0, 0.0], [0.26, 0.0], [0.26, 1.0], [-0.04, 1.08]],
      [[0.26, 0.0], [0.8, 0.02], [0.92, 0.3], [0.26, 0.52]],            // panse
      [[0.4, 0.473], [0.66, 0.387], [1.04, 1.06], [0.74, 1.04]]         // jambe
    ] },
    T: { w: 0.92, s: [
      [[-0.14, -0.02], [0.92, -0.08], [0.86, 0.2], [0.0, 0.2]],
      [[0.32, 0.2], [0.6, 0.2], [0.58, 0.95], [0.36, 1.2]]
    ] },
    I: { w: 0.44, s: [
      [[0.04, 0.05], [0.32, -0.22], [0.32, 1.0], [0.04, 1.0]]
    ] },
    N: { w: 1.2, s: [
      [[0.0, 0.0], [0.24, 0.0], [0.24, 1.0], [-0.04, 1.06]],
      [[0.24, 0.0], [0.52, 0.0], [0.92, 0.62], [0.92, 1.0]],
      [[0.92, 0.0], [1.3, -0.26], [1.16, 1.0], [0.92, 1.0]]
    ] }
  };
  var NAME = ['GALVEZ', 'MARTIN'];
  var PIECES = 120;

  var canvas = document.getElementById('mur');
  var ctx = canvas.getContext('2d');
  var bed = document.createElement('canvas');
  var bctx = bed.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR, FS, GAP, RIMW;
  var pieces = [], info = {};
  var t0 = 0, running = false;

  /* ---------- Outils ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var R = rng(1);
  function centroid(p) {
    var x = 0, y = 0;
    p.forEach(function (q) { x += q[0]; y += q[1]; });
    return [x / p.length, y / p.length];
  }
  function bbox(p) {
    var b = [Infinity, Infinity, -Infinity, -Infinity];
    p.forEach(function (q) { b[0] = Math.min(b[0], q[0]); b[1] = Math.min(b[1], q[1]); b[2] = Math.max(b[2], q[0]); b[3] = Math.max(b[3], q[1]); });
    return b;
  }
  function hex(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function css(c, k) {
    k = k || 0; var t = k > 0 ? 255 : 0, a = Math.abs(k);
    return 'rgb(' + ((c[0] + (t - c[0]) * a) | 0) + ',' + ((c[1] + (t - c[1]) * a) | 0) + ',' + ((c[2] + (t - c[2]) * a) | 0) + ')';
  }
  // Rétrécit un polygone convexe en reculant chaque côté de d (vrai décalage parallèle).
  // d : une distance, ou une distance par côté.
  function inset(p, d) {
    var n = p.length, s = 0, out = [];
    var dd = typeof d === 'number' ? p.map(function () { return d; }) : d;
    for (var i = 0; i < n; i++) { var a = p[i], b = p[(i + 1) % n]; s += a[0] * b[1] - b[0] * a[1]; }
    var dir = s > 0 ? 1 : -1;
    var lines = [];
    for (i = 0; i < n; i++) {
      var a2 = p[i], b2 = p[(i + 1) % n], dx = b2[0] - a2[0], dy = b2[1] - a2[1], l = Math.hypot(dx, dy) || 1;
      var nx = -dy / l * dir, ny = dx / l * dir;               // normale intérieure
      lines.push([a2[0] + nx * dd[i], a2[1] + ny * dd[i], dx, dy]);
    }
    for (i = 0; i < n; i++) {
      var L1 = lines[(i - 1 + n) % n], L2 = lines[i];
      var den = L1[2] * L2[3] - L1[3] * L2[2];
      if (Math.abs(den) < 1e-9) { out.push([L2[0], L2[1]]); continue; }
      var t = ((L2[0] - L1[0]) * L2[3] - (L2[1] - L1[1]) * L2[2]) / den;
      out.push([L1[0] + L1[2] * t, L1[1] + L1[3] * t]);
    }
    return out;
  }

  /* ---------- Découpe des éclats : jamais plus de 4 côtés ----------
     Chaque éclat garde la trace de ses côtés « extérieurs » (le bord de la
     lettre, qui reçoit l'émail blanc) et de ses côtés de coupe (simple joint). */
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function len(a, b) { return Math.hypot(b[0] - a[0], b[1] - a[1]); }
  function polyArea(v) {
    var a = 0;
    for (var i = 0; i < v.length; i++) { var p = v[i], q = v[(i + 1) % v.length]; a += p[0] * q[1] - q[0] * p[1]; }
    return Math.abs(a) / 2;
  }
  function minWidth(v) {
    // largeur minimale approximative : aire / plus grand côté
    var m = 0;
    for (var i = 0; i < v.length; i++) m = Math.max(m, len(v[i], v[(i + 1) % v.length]));
    return polyArea(v) / m * (v.length === 3 ? 2 : 1);
  }
  function split(sh) {
    var v = sh.v, e = sh.e, t = 0.35 + R() * 0.3, t2 = 0.35 + R() * 0.3;
    if (v.length === 4) {
      var l0 = len(v[0], v[1]) + len(v[2], v[3]), l1 = len(v[1], v[2]) + len(v[3], v[0]);
      if (R() < 0.3) {
        // diagonale : deux triangles
        var k = R() < 0.5 ? 0 : 1;
        var a = v[k], b = v[k + 1], c = v[k + 2], d = v[(k + 3) % 4];
        var ea = e[k], eb = e[k + 1], ec = e[(k + 2) % 4], ed = e[(k + 3) % 4];
        return [{ v: [a, b, c], e: [ea, eb, false] }, { v: [a, c, d], e: [false, ec, ed] }];
      }
      // coupe d'un côté au côté opposé, à travers la plus grande longueur : deux quadrilatères
      var o = l0 >= l1 ? 0 : 1;
      var A = v[o], B = v[o + 1], C = v[(o + 2) % 4], D = v[(o + 3) % 4];
      var eA = e[o], eB = e[o + 1], eC = e[(o + 2) % 4], eD = e[(o + 3) % 4];
      var P = lerp(A, B, t), Q = lerp(D, C, t2);
      return [{ v: [A, P, Q, D], e: [eA, false, eC, eD] }, { v: [P, B, C, Q], e: [eA, eB, eC, false] }];
    }
    // triangle : depuis le sommet opposé au plus grand côté, ou en travers (triangle + trapèze)
    var L = [len(v[0], v[1]), len(v[1], v[2]), len(v[2], v[0])];
    var i = L.indexOf(Math.max.apply(null, L));
    var a2 = v[i], b2 = v[(i + 1) % 3], c2 = v[(i + 2) % 3];
    var ea2 = e[i], eb2 = e[(i + 1) % 3], ec2 = e[(i + 2) % 3];
    if (R() < 0.6) {
      var M = lerp(a2, b2, t);
      return [{ v: [a2, M, c2], e: [ea2, false, ec2] }, { v: [M, b2, c2], e: [ea2, eb2, false] }];
    }
    var P2 = lerp(c2, a2, t), Q2 = lerp(b2, c2, 1 - t);   // coupe parallèle au grand côté
    return [{ v: [a2, b2, Q2, P2], e: [ea2, eb2, false, ec2] }, { v: [P2, Q2, c2], e: [false, eb2, ec2] }];
  }
  function subdivide(shapes, total) {
    var guard = 0;
    while (shapes.length < total && guard++ < 2000) {
      // on coupe le plus gros éclat encore assez épais
      var best = -1, bestA = 0;
      shapes.forEach(function (sh, i) {
        var a = polyArea(sh.v);
        if (!sh.lock && a > bestA && minWidth(sh.v) > FS * 0.07) { bestA = a; best = i; }
      });
      if (best < 0) break;
      var parts = split(shapes[best]);
      if (parts.some(function (p) { return minWidth(p.v) < FS * 0.035; })) {
        parts = split(shapes[best]);                       // un autre essai
        if (parts.some(function (p) { return minWidth(p.v) < FS * 0.035; })) { shapes[best].lock = true; continue; }
      }
      parts.forEach(function (p) { p.stroke = shapes[best].stroke; });
      shapes.splice(best, 1, parts[0], parts[1]);
    }
    return shapes;
  }

  function path(c, q, r) {
    var n = q.length;
    c.beginPath();
    for (var i = 0; i < n; i++) {
      var a = q[(i - 1 + n) % n], b = q[i], d = q[(i + 1) % n];
      if (i === 0) c.moveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      c.arcTo(b[0], b[1], (b[0] + d[0]) / 2, (b[1] + d[1]) / 2, r);
    }
    c.closePath();
  }

  /* ---------- Construction ---------- */
  function build() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = bed.width = Math.round(W * DPR);
    canvas.height = bed.height = Math.round(H * DPR);
    R = rng(21);
    pieces = [];

    var oneLine = W / H > 2.1;
    var lines = oneLine ? [NAME.join(' ')] : NAME;
    var TRACK = 0.12, SPACE = 0.5, SHEAR = 0.2;
    function lineWidth(t) {
      var w = 0;
      Array.from(t).forEach(function (ch) { w += ch === ' ' ? SPACE : LETTERS[ch].w + TRACK; });
      return w + 0.35;
    }
    var maxW = Math.max.apply(null, lines.map(lineWidth));
    FS = Math.min(W * 0.84 / maxW, H * (oneLine ? 0.36 : 0.28));
    GAP = Math.max(2, FS * 0.02);            // le joint : on doit toujours voir les éclats
    RIMW = Math.max(2.5, FS * 0.045);            // émail blanc sur le bord de chaque éclat
    var lineH = FS * 1.5;
    var top0 = H / 2 - ((lines.length - 1) * lineH + FS) / 2 - FS * 0.06;

    var shapes = [];
    lines.forEach(function (text, li) {
      var x = W / 2 - lineWidth(text) * FS / 2 + 0.2 * FS + (lines.length > 1 ? (li ? 0.22 : -0.22) * FS : 0);
      var y0 = top0 + li * lineH;
      Array.from(text).forEach(function (ch, ci) {
        if (ch === ' ') { x += SPACE * FS; return; }
        var L = LETTERS[ch], rot = (R() - 0.5) * 0.12, dy = (R() - 0.5) * 0.1 * FS;
        var cx = x + L.w * FS / 2, cy = y0 + FS / 2;
        L.s.forEach(function (poly) {
          var pts = poly.map(function (v) {
            var px = v[0] + (1 - v[1]) * SHEAR - SHEAR / 2;
            var X = x + px * FS - cx, Y = y0 + v[1] * FS + dy - cy;
            return [cx + X * Math.cos(rot) - Y * Math.sin(rot), cy + X * Math.sin(rot) + Y * Math.cos(rot)];
          });
          shapes.push({ v: pts, e: pts.map(function () { return true; }), stroke: shapes.length });
        });
        x += (L.w + TRACK) * FS;
      });
    });

    // 31 éclats dessinés, redécoupés jusqu'à 120.
    subdivide(shapes, PIECES);
    var strokeInk = {};
    shapes.forEach(function (sh) {
      if (!(sh.stroke in strokeInk)) strokeInk[sh.stroke] = (R() * INKS.length) | 0;
      var ink = INKS[R() < 0.6 ? strokeInk[sh.stroke] : (R() * INKS.length) | 0];
      var q = inset(sh.v, GAP / 2);
      var inner = inset(q, sh.e.map(function (out) { return out ? RIMW : 0; }));
      if (polyArea(inner) < polyArea(q) * 0.15) inner = q;  // trop petit pour l'émail
      pieces.push({ q: q, inner: inner, c: centroid(q), ink: hex(ink), tone: (R() - 0.5) * 0.1 });
    });

    var all = bbox([].concat.apply([], pieces.map(function (p) { return p.q; })));
    info = { cx: (all[0] + all[2]) / 2, cy: (all[1] + all[3]) / 2, rx: (all[2] - all[0]) / 2, ry: (all[3] - all[1]) / 2, count: pieces.length };
    plan();
  }

  /* ---------- Animation : du centre vers les extrémités, du spectateur vers le mur ---------- */
  var IMPACT = 180;
  function plan() {
    var last = 0;
    pieces.forEach(function (p) {
      p.r1 = R(); p.r2 = R(); p.r3 = R(); p.r4 = R();
      var dn = Math.min(1, Math.hypot((p.c[0] - info.cx) / info.rx, (p.c[1] - info.cy) / (info.ry * 1.6)));
      p.delay = 150 + dn * 1700 + p.r1 * 160;
      p.dur = 560 + p.r2 * 160;
      p.rot0 = (p.r3 - 0.5) * 3.2;
      p.tilt0 = 0.5 + p.r4 * 0.8;
      p.axis = p.r1 * Math.PI;
      p.lx = (p.r2 - 0.5) * FS * 1.2; p.ly = (p.r3 - 0.5) * FS * 0.8 - FS * 0.3;
      p.placed = false; p.hit = false;
      last = Math.max(last, p.delay + p.dur + IMPACT);
    });
    info.total = last;
  }

  function drawWall() {
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bctx.fillStyle = WALL;
    bctx.fillRect(0, 0, W, H);
    // Halo rose bombé derrière le nom, comme sur le mur de référence.
    bctx.save();
    bctx.translate(info.cx, info.cy + info.ry * 0.25);
    bctx.scale(1, Math.max(0.4, info.ry / info.rx * 1.4));
    var g = bctx.createRadialGradient(0, 0, 0, 0, 0, info.rx * 1.15);
    g.addColorStop(0, 'rgba(255,118,168,.42)');
    g.addColorStop(0.6, 'rgba(255,118,168,.14)');
    g.addColorStop(1, 'rgba(255,118,168,0)');
    bctx.fillStyle = g;
    bctx.fillRect(-W * 2, -H * 4, W * 4, H * 8);
    bctx.restore();
    var gr = rng(9);
    for (var i = 0; i < W * H / 50; i++) {
      bctx.fillStyle = gr() < 0.5 ? 'rgba(255,255,255,.06)' : 'rgba(90,40,10,.07)';
      bctx.fillRect(gr() * W, gr() * H, 1 + gr() * 1.5, 1 + gr() * 1.5);
    }
  }

  // Un éclat posé : ombre dans le joint, bord émaillé blanc, cœur sombre facetté.
  function drawPiece(c, q, inner, p, alpha, flash) {
    var r = Math.max(1.5, FS * 0.012);
    c.globalAlpha = alpha;
    c.fillStyle = RIM;
    path(c, q, r); c.fill();
    var bb = bbox(inner);
    var g = c.createLinearGradient(bb[0], bb[1], bb[2], bb[3]);
    g.addColorStop(0, css(p.ink, p.tone + 0.16));
    g.addColorStop(0.45, css(p.ink, p.tone));
    g.addColorStop(1, css(p.ink, p.tone - 0.05));
    c.fillStyle = g;
    path(c, inner, r * 0.6); c.fill();
    // Reflet de vernis sur l'arête haute.
    c.strokeStyle = 'rgba(255,255,255,.35)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(inner[0][0], inner[0][1]); c.lineTo(inner[1][0], inner[1][1]);
    c.stroke();
    if (flash > 0) { c.globalAlpha = flash; c.fillStyle = '#fff'; path(c, q, r); c.fill(); }
    c.globalAlpha = 1;
  }

  function placeOnBed(p) {
    bctx.fillStyle = 'rgba(80,30,8,.35)';
    path(bctx, p.q.map(function (v) { return [v[0] + 1.5, v[1] + 2]; }), 2);
    bctx.fill();
    drawPiece(bctx, p.q, p.inner, p, 1, 0);
  }

  function drawFlying(p, prog, impact) {
    var h = impact >= 0 ? 0 : 1 - prog * prog;
    var persp = 1 / (1 - h * 0.82);
    var scale = persp * (impact >= 0 ? 1 - 0.05 * Math.sin(impact * Math.PI) : 1);
    var px = p.c[0] + (p.c[0] - W / 2) * (persp - 1) * 0.22 + p.lx * h;
    var py = p.c[1] + (p.c[1] - H / 2) * (persp - 1) * 0.22 + p.ly * h;
    var rot = p.rot0 * h, tilt = Math.cos(p.tilt0 * h);
    var ca = Math.cos(p.axis), sa = Math.sin(p.axis), cr = Math.cos(rot), sr = Math.sin(rot);
    function tf(v, ox, oy, k) {
      var x = v[0] - p.c[0], y = v[1] - p.c[1];
      var along = (x * ca + y * sa) * tilt, across = -x * sa + y * ca;
      x = (along * ca - across * sa) * k; y = (along * sa + across * ca) * k;
      return [ox + x * cr - y * sr, oy + x * sr + y * cr];
    }
    if (h > 0.001) {                          // ombre portée sur le mur
      ctx.globalAlpha = 0.08 + 0.32 * Math.pow(1 - h, 2);
      ctx.fillStyle = 'rgb(80,30,8)';
      path(ctx, p.q.map(function (v) { return tf(v, p.c[0] + h * FS * 0.35, p.c[1] + h * FS * 0.5, 1 + h * 0.5); }), 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    var alpha = Math.min(1, prog * 5) * (0.6 + 0.4 * (1 - h));
    var flash = impact >= 0 && impact < 0.6 ? 0.5 * (1 - impact / 0.6) : 0;
    drawPiece(ctx, p.q.map(function (v) { return tf(v, px, py, scale); }),
                   p.inner.map(function (v) { return tf(v, px, py, scale); }), p, alpha, flash);
    var shade = (1 - Math.abs(tilt)) * 0.45;
    if (shade > 0.02) {
      ctx.globalAlpha = alpha * shade; ctx.fillStyle = '#000';
      path(ctx, p.q.map(function (v) { return tf(v, px, py, scale); }), 2); ctx.fill(); ctx.globalAlpha = 1;
    }
  }

  var shake = 0;
  function frame(now) {
    var time = now - t0, flying = [], hits = 0;
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pieces.forEach(function (p) {
      if (p.placed) return;
      var tau = time - p.delay;
      if (tau < 0) return;
      if (tau > p.dur + IMPACT) { placeOnBed(p); p.placed = true; return; }
      if (tau > p.dur && !p.hit) { p.hit = true; hits++; }
      flying.push(p);
    });
    // Chaque éclat qui frappe le mur le fait trembler un peu.
    shake = Math.min(8, shake * 0.8 + hits * 1.3);
    var ox = (Math.random() - 0.5) * shake, oy = (Math.random() - 0.5) * shake;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bed, ox * DPR, oy * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
    flying.sort(function (a, b) { return (time - b.delay) / b.dur - (time - a.delay) / a.dur; });
    flying.forEach(function (p) {
      var tt = time - p.delay;
      if (tt <= p.dur) drawFlying(p, tt / p.dur, -1); else drawFlying(p, 1, (tt - p.dur) / IMPACT);
    });
    if (time < info.total + 400) requestAnimationFrame(frame);
    else { running = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0); }
  }

  function play() {
    drawWall();
    pieces.forEach(function (p) { p.placed = false; p.hit = false; });
    if (reduceMotion) {
      pieces.forEach(function (p) { placeOnBed(p); p.placed = true; });
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0);
      return;
    }
    t0 = performance.now();
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  document.getElementById('rejouer').addEventListener('click', play);
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); play(); }
  });
  var timer, lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 60) return;
      lastW = window.innerWidth; lastH = window.innerHeight;
      build(); play();
    }, 250);
  });

  build();
  play();
  window.__count = pieces.length;
})();
</script>
