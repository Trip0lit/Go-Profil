<meta charset="utf-8">
<title>Galvez Martin en mosaïque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Metamorphous&family=Poller+One&family=Playfair+Display+SC:wght@900&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Une seule scène : un panneau de mosaïque encadré, quatre versions au choix en bas. */
  :root {
    --page: #1d1c1a;
    --panel: rgba(20, 19, 17, .86);
    --panel-ink: #f6f1ea;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--panel-ink); font-family: var(--ui); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 2px; align-items: center;
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 5px; border-radius: 14px; max-width: calc(100% - 24px); overflow-x: auto;
  }
  .controls button {
    font: 600 13px/1 var(--ui); color: var(--panel-ink); background: transparent; border: 0; cursor: pointer;
    padding: 10px 12px; border-radius: 9px; white-space: nowrap;
  }
  .controls button:hover { background: rgba(255, 255, 255, .1); }
  .controls button[aria-pressed="true"] { background: rgba(255, 255, 255, .2); }
  .controls button:focus-visible { outline: 2px solid var(--panel-ink); outline-offset: 1px; }
  .controls .sep { width: 1px; align-self: stretch; margin: 4px 3px; background: rgba(255, 255, 255, .2); }
  @media (max-width: 520px) { .controls button { padding: 10px 8px; font-size: 12px; } }
</style>

<canvas id="mur" role="img" aria-label="GALVEZ MARTIN, en mosaïque"></canvas>
<div class="controls" role="group" aria-label="Choix de la version">
  <button type="button" id="v1" data-v="metro" aria-pressed="true">1 Métro</button>
  <button type="button" id="v2" data-v="ancien" aria-pressed="false">2 Sol ancien</button>
  <button type="button" id="v3" data-v="nuit" aria-pressed="false">3 Métro nuit</button>
  <button type="button" id="v4" data-v="faience" aria-pressed="false">4 Faïence</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="rejouer" aria-label="Rejouer">↻</button>
</div>

<script>
(function () {
  'use strict';

  var NAME = 'GALVEZ MARTIN';
  /* ---------- Les quatre versions ----------
     fond : 'ecailles' (éventails du métro) ou 'rangs' (rangées horizontales)
     anim : ordre de pose, les pièces tombant toujours du spectateur vers le mur */
  var VARIANTS = {
    metro: {
      font: '"Limelight"', grout: '#8a877f', page: '#1d1c1a', fond: 'ecailles', halo: 1, stroke: 0.11,
      letter: ['#eba51c', '#f5bb36', '#e09812', '#f2b02a'], letter2: ['#f7c95a', '#f9d16c'],
      line: ['#1c1c1b', '#232321', '#151514'], halo1: ['#fbfaf6', '#f2f1ec'],
      bg: ['#f6f5f1', '#eeede8', '#fafaf7', '#e8e7e2'], bgRing: ['#c8c7c1', '#bdbcb6', '#d1d0ca'],
      frame: [['#1c1c1b'], ['#eba51c', '#f2b02a'], ['#eba51c', '#e09812'], ['#1c1c1b']],
      anim: 'centre'
    },
    ancien: {
      font: '"Metamorphous"', grout: '#8f877b', page: '#1e1b18', fond: 'rangs', halo: 3, stroke: 0.055,
      letter: ['#6b2a22', '#7a3128', '#5e231c', '#83372c'], letter2: ['#4f1d18'],
      line: ['#5e231c'], halo1: ['#f3eee3', '#ebe5d8', '#f7f3ea'],
      bg: ['#efe8d9', '#e6dfcf', '#f3eee2', '#ddd5c3', '#e9e2d3'], bgRing: ['#d8cfbb'],
      frame: [['#3d6b4a', '#356042'], ['#efe8d9'], ['#a65a32', '#b4683c', '#9a5230'], ['#efe8d9'], ['#3d6b4a', '#2f5a3e']],
      anim: 'lettre'
    },
    nuit: {
      font: '"Poller One"', grout: '#0c0f16', page: '#07080c', fond: 'ecailles', halo: 1, stroke: 0.12,
      letter: ['#d6a83a', '#e3b84d', '#c8972c', '#ecc35e'], letter2: ['#f3d27a'],
      line: ['#f1ede4', '#e7e2d7'], halo1: ['#0f1524', '#121a2c'],
      bg: ['#1a2a4a', '#1f3157', '#172440', '#22365f'], bgRing: ['#2f4a7d', '#35528a', '#2a4373'],
      frame: [['#d6a83a', '#c8972c'], ['#0f1524'], ['#d6a83a', '#e3b84d'], ['#f1ede4']],
      anim: 'fond'
    },
    faience: {
      font: '900 {s}px "Playfair Display SC"', grout: '#9aa3ad', page: '#141a22', fond: 'ecailles', halo: 2, stroke: 0.09,
      letter: ['#3f74c9', '#4a80d2', '#3568bc', '#5589d6'], letter2: ['#2a5db5'],
      line: ['#0b1d42', '#0d2250'], halo1: ['#ffffff', '#f3f6fa', '#e7eef8'],
      bg: ['#ffffff', '#f4f7fb', '#eef2f8', '#f9fbfd'], bgRing: ['#9cb9e3', '#a9c3e8', '#8fb0de'],
      frame: [['#1f4fa3'], ['#ffffff'], ['#5f8fd0', '#6a99d6'], ['#ffffff'], ['#1f4fa3', '#1a4590']],
      anim: 'vague'
    }
  };
  var variant = 'metro', cache = {};

  var canvas = document.getElementById('mur');
  var ctx = canvas.getContext('2d');
  var bed = document.createElement('canvas');
  var bctx = bed.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR, G = 2, gw, gh, FS, GAP;
  var pieces = [], info = {};
  var t0 = 0, running = false;

  /* ---------- Hasard reproductible ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var R = rng(1);
  function pick(arr) { return arr[(R() * arr.length) | 0]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function hex(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function css(c, k) {
    k = k || 0;
    var t = k > 0 ? 255 : 0, a = Math.abs(k);
    return 'rgb(' + ((c[0] + (t - c[0]) * a) | 0) + ',' + ((c[1] + (t - c[1]) * a) | 0) + ',' + ((c[2] + (t - c[2]) * a) | 0) + ')';
  }

  /* ---------- Transformée de distance euclidienne exacte (Felzenszwalb) ---------- */
  var BIG = 1e12;
  function edt(inside, w, h) {
    // Pour chaque case « dedans », distance à la case « dehors » la plus proche.
    var f = new Float64Array(Math.max(w, h)), d = new Float64Array(Math.max(w, h));
    var v = new Int32Array(Math.max(w, h)), z = new Float64Array(Math.max(w, h) + 1);
    var grid = new Float64Array(w * h), out = new Float32Array(w * h), x, y, n;
    for (var i = 0; i < w * h; i++) grid[i] = inside[i] ? BIG : 0;
    function pass(n) {
      var k = 0, q, s;
      v[0] = 0; z[0] = -BIG; z[1] = BIG;
      for (q = 1; q < n; q++) {
        s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = s; z[k + 1] = BIG;
      }
      k = 0;
      for (q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
    }
    for (x = 0; x < w; x++) {
      for (y = 0; y < h; y++) f[y] = grid[y * w + x];
      pass(h);
      for (y = 0; y < h; y++) grid[y * w + x] = d[y];
    }
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) f[x] = grid[y * w + x];
      pass(w);
      for (x = 0; x < w; x++) out[y * w + x] = Math.sqrt(d[x]) * G;
    }
    return out;
  }

  /* ---------- Courbes de niveau (marching squares) ---------- */
  var CASES = [[], [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], null, [[0, 2]], [[2, 3]],
               [[2, 3]], [[0, 2]], null, [[1, 2]], [[3, 1]], [[0, 1]], [[3, 0]], []];
  function contours(D, w, h, level) {
    var pts = new Map(), adj = new Map();
    function key(i, j, e) {
      // arête haute/basse : horizontale ; gauche/droite : verticale
      if (e === 0) return (j * w + i) * 2;
      if (e === 2) return ((j + 1) * w + i) * 2;
      if (e === 3) return (j * w + i) * 2 + 1;
      return (j * w + i + 1) * 2 + 1;
    }
    function point(i, j, e, a, b, c, d) {
      var t;
      if (e === 0) { t = (level - a) / (b - a); return [i + t, j]; }
      if (e === 1) { t = (level - b) / (c - b); return [i + 1, j + t]; }
      if (e === 2) { t = (level - d) / (c - d); return [i + t, j + 1]; }
      t = (level - a) / (d - a); return [i, j + t];
    }
    function link(k1, k2) {
      (adj.get(k1) || adj.set(k1, []).get(k1)).push(k2);
      (adj.get(k2) || adj.set(k2, []).get(k2)).push(k1);
    }
    for (var j = 0; j < h - 1; j++) {
      for (var i = 0; i < w - 1; i++) {
        var a = D[j * w + i], b = D[j * w + i + 1], c = D[(j + 1) * w + i + 1], d = D[(j + 1) * w + i];
        var idx = (a >= level ? 1 : 0) | (b >= level ? 2 : 0) | (c >= level ? 4 : 0) | (d >= level ? 8 : 0);
        if (idx === 0 || idx === 15) continue;
        var segs = CASES[idx];
        if (!segs) {
          var centre = (a + b + c + d) / 4 >= level;
          segs = idx === 5 ? (centre ? [[0, 1], [2, 3]] : [[3, 0], [1, 2]])
                           : (centre ? [[3, 0], [1, 2]] : [[0, 1], [2, 3]]);
        }
        for (var s = 0; s < segs.length; s++) {
          var e1 = segs[s][0], e2 = segs[s][1], k1 = key(i, j, e1), k2 = key(i, j, e2);
          if (!pts.has(k1)) pts.set(k1, point(i, j, e1, a, b, c, d));
          if (!pts.has(k2)) pts.set(k2, point(i, j, e2, a, b, c, d));
          link(k1, k2);
        }
      }
    }
    // Assemble les segments en polylignes.
    var used = new Set(), lines = [];
    function walk(start, prev, out) {
      var cur = start, p = prev;
      for (;;) {
        var nb = adj.get(cur), next = null;
        for (var n = 0; n < nb.length; n++) {
          var cand = nb[n];
          if (cand !== p && !used.has(edgeId(cur, cand))) { next = cand; break; }
        }
        if (next === null) return false;
        used.add(edgeId(cur, next));
        if (next === out[0] && out.length > 2) return true; // boucle fermée
        out.push(next); p = cur; cur = next;
      }
    }
    function edgeId(x, y) { return x < y ? x + ':' + y : y + ':' + x; }
    adj.forEach(function (nb, k) {
      for (var n = 0; n < nb.length; n++) {
        if (used.has(edgeId(k, nb[n]))) continue;
        used.add(edgeId(k, nb[n]));
        var fwd = [k, nb[n]];
        var closed = walk(nb[n], k, fwd);
        if (!closed) {
          var back = [k];
          walk(k, nb[n], back);
          fwd = back.reverse().concat(fwd.slice(1));
        }
        lines.push({ closed: closed, pts: fwd.map(function (kk) { var p = pts.get(kk); return [(p[0] + .5) * G, (p[1] + .5) * G]; }) });
      }
    });
    return lines;
  }

  function smooth(line) {
    var p = line.pts, n = p.length;
    if (n < 4) return p;
    for (var it = 0; it < 3; it++) {
      var q = [];
      for (var i = 0; i < n; i++) {
        var a = p[line.closed ? (i - 1 + n) % n : Math.max(0, i - 1)];
        var b = p[i];
        var c = p[line.closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
        q.push([(a[0] + 2 * b[0] + c[0]) / 4, (a[1] + 2 * b[1] + c[1]) / 4]);
      }
      p = q;
    }
    return p;
  }

  function rdp(pts, tol) {
    if (pts.length < 3) return pts.slice();
    var a = pts[0], b = pts[pts.length - 1], dmax = 0, idx = 0;
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    for (var i = 1; i < pts.length - 1; i++) {
      var d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + b[0] * a[1] - b[1] * a[0]) / l;
      if (d > dmax) { dmax = d; idx = i; }
    }
    if (dmax <= tol) return [a, b];
    var left = rdp(pts.slice(0, idx + 1), tol), right = rdp(pts.slice(idx), tol);
    return left.slice(0, -1).concat(right);
  }
  function rdpLoop(pts, tol) {
    var far = 0, dm = 0;
    for (var i = 1; i < pts.length; i++) {
      var d = Math.hypot(pts[i][0] - pts[0][0], pts[i][1] - pts[0][1]);
      if (d > dm) { dm = d; far = i; }
    }
    var a = rdp(pts.slice(0, far + 1), tol), b = rdp(pts.slice(far).concat([pts[0]]), tol);
    return a.slice(0, -1).concat(b.slice(0, -1));
  }

  function sharpen(F, V, fs) {
    var Ff = new Float32Array(F.length);
    for (var k = 0; k < F.length; k++) Ff[k] = F[k];
    var loops = contours(Ff, gw, gh, 0.5).filter(function (l) { return l.pts.length > 6; });
    var c = document.createElement('canvas'); c.width = gw; c.height = gh;
    var x = c.getContext('2d', { willReadFrequently: true });
    function inside(px, py) {
      var gx = (px / G) | 0, gy = (py / G) | 0;
      return gx >= 0 && gy >= 0 && gx < gw && gy < gh && F[gy * gw + gx];
    }
    x.beginPath();
    loops.forEach(function (l) {
      var p = rdpLoop(l.pts, fs * V.tol), n = p.length;
      if (n < 3) return;
      var out = [];
      for (var i = 0; i < n; i++) {
        var a = p[(i - 1 + n) % n], v = p[i], b = p[(i + 1) % n];
        var ax = a[0] - v[0], ay = a[1] - v[1], bx = b[0] - v[0], by = b[1] - v[1];
        var la = Math.hypot(ax, ay) || 1, lb = Math.hypot(bx, by) || 1;
        var ang = Math.acos(clamp((ax * bx + ay * by) / (la * lb), -1, 1)) * 180 / Math.PI;
        var mx = ax / la + bx / lb, my = ay / la + by / lb, ml = Math.hypot(mx, my) || 1;
        mx /= ml; my /= ml;
        // Coin saillant (le dedans de l'angle est plein) : on l'étire en pointe.
        if (ang < V.spikeAngle && inside(v[0] + mx * 3, v[1] + my * 3)) {
          var len = fs * V.spike * Math.pow(1 - ang / V.spikeAngle, 0.7) * (0.6 + R() * 0.8);
          out.push([v[0] - mx * len, v[1] - my * len]);
        } else out.push(v);
      }
      x.moveTo(out[0][0] / G, out[0][1] / G);
      for (var j = 1; j < out.length; j++) x.lineTo(out[j][0] / G, out[j][1] / G);
      x.closePath();
    });
    x.fillStyle = '#000';
    x.fill('evenodd');
    var img = x.getImageData(0, 0, gw, gh).data, S2 = new Uint8Array(F.length);
    for (k = 0; k < F.length; k++) S2[k] = img[k * 4 + 3] > 110 ? 1 : 0;
    return S2;
  }


  /* ---------- Pose en rangées qui suivent les formes (andamento) ----------
     Comme sur la mosaïque de référence : dans chaque zone, les éclats sont
     alignés en rangées parallèles au bord, puis les trous sont comblés. */
  var occ, ROW;

  function inQuad(q, x, y) {
    var sign = 0;
    for (var i = 0; i < 4; i++) {
      var a = q[i], b = q[(i + 1) % 4];
      var cr = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
      if (cr !== 0) { if (sign === 0) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return false; }
    }
    return true;
  }

  function tryTile(q, mask, minIn, region) {
    // Refuse les formes vrillées ou trop fines (sur les lignes de crête).
    var area = 0, sgn = 0;
    for (var e = 0; e < 4; e++) {
      var p0 = q[e], p1 = q[(e + 1) % 4], p2 = q[(e + 2) % 4];
      area += p0[0] * p1[1] - p1[0] * p0[1];
      var cr = (p1[0] - p0[0]) * (p2[1] - p1[1]) - (p1[1] - p0[1]) * (p2[0] - p1[0]);
      var sg = cr > 0 ? 1 : -1;
      if (sgn && sg !== sgn) return false;
      sgn = sg;
    }
    if (Math.abs(area) / 2 < ROW * ROW * 0.22) return false;
    for (var e2 = 0; e2 < 4; e2++) if (Math.hypot(q[(e2 + 1) % 4][0] - q[e2][0], q[(e2 + 1) % 4][1] - q[e2][1]) > ROW * 2.8) return false;
    // Échantillonne la tesselle : elle doit être dans sa zone et ne chevaucher personne.
    var inside = 0, free = 0, total = 0;
    for (var u = 0.15; u < 0.9; u += 0.35) {
      for (var v = 0.2; v < 0.9; v += 0.3) {
        var x = (q[0][0] * (1 - u) + q[1][0] * u) * (1 - v) + (q[3][0] * (1 - u) + q[2][0] * u) * v;
        var y = (q[0][1] * (1 - u) + q[1][1] * u) * (1 - v) + (q[3][1] * (1 - u) + q[2][1] * u) * v;
        var gx = (x / G) | 0, gy = (y / G) | 0;
        total++;
        if (gx < 0 || gy < 0 || gx >= gw || gy >= gh) continue;
        if (mask[gy * gw + gx]) inside++;
        if (!occ[gy * gw + gx]) free++;
      }
    }
    if (inside < total * minIn || free < total * 0.9) return false;
    var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    q.forEach(function (p) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
    for (var gy2 = Math.max(0, (miny / G) | 0); gy2 <= Math.min(gh - 1, (maxy / G) | 0); gy2++) {
      for (var gx2 = Math.max(0, (minx / G) | 0); gx2 <= Math.min(gw - 1, (maxx / G) | 0); gx2++) {
        if (inQuad(q, (gx2 + .5) * G, (gy2 + .5) * G)) occ[gy2 * gw + gx2] = 1;
      }
    }
    var cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
    pieces.push({ q: q, c: [cx, cy], kind: region });
    return true;
  }

  function jitter(q, amt) {
    return q.map(function (p) { return [p[0] + (R() - .5) * 2 * amt, p[1] + (R() - .5) * 2 * amt]; });
  }

  // Pose des rangées de tesselles le long des courbes de niveau d'une zone :
  // c'est l'« andamento » des mosaïstes, les rangées épousent la forme.
  function layRows(mask, D, region, lenK) {
    var maxD = 0;
    for (var i = 0; i < D.length; i++) if (D[i] > maxD) maxD = D[i];
    var gap = ROW * 0.17, half = ROW / 2 - gap / 2;
    for (var level = ROW * 0.5; level < maxD; level += ROW) {
      var lines = contours(D, gw, gh, level);
      lines.forEach(function (line) {
        var p = smooth(line), n = p.length;
        if (n < 3) return;
        var acc = [0];
        for (var i = 1; i < n; i++) acc.push(acc[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
        if (line.closed) acc.push(acc[n - 1] + Math.hypot(p[0][0] - p[n - 1][0], p[0][1] - p[n - 1][1]));
        var len = acc[acc.length - 1];
        if (len < ROW * 0.7) return;
        function at(s) {
          s = line.closed ? ((s % len) + len) % len : clamp(s, 0, len);
          var lo = 0, hi = acc.length - 1;
          while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (acc[mid] <= s) lo = mid; else hi = mid; }
          var a = p[lo % n], b = p[hi % n], seg = acc[hi] - acc[lo] || 1, t = (s - acc[lo]) / seg;
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        }
        function normal(s) {
          var a = at(s - ROW * 0.4), b = at(s + ROW * 0.4), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
          return [-dy / l, dx / l];
        }
        var s = line.closed ? R() * ROW : 0;
        var end = line.closed ? s + len : len;
        while (s < end - ROW * 0.35) {
          var L = ROW * lenK * (0.7 + R() * 0.6);
          var e = Math.min(s + L, end);
          var sa = s + gap / 2, sb = e - gap / 2;
          if (sb - sa > ROW * 0.3) {
            var A = at(sa), B = at(sb), na = normal(sa), nb = normal(sb);
            var ha = half * (0.9 + R() * 0.12), hb = half * (0.9 + R() * 0.12);
            var q = jitter([
              [A[0] + na[0] * ha, A[1] + na[1] * ha], [B[0] + nb[0] * hb, B[1] + nb[1] * hb],
              [B[0] - nb[0] * hb, B[1] - nb[1] * hb], [A[0] - na[0] * ha, A[1] - na[1] * ha]
            ], ROW * 0.1);
            tryTile(q, mask, 0.7, region);
          }
          s = e;
        }
      });
    }
  }

  // Bouche les trous restants avec de petites tesselles taillées sur mesure.
  function fillGaps(mask, D, region) {
    var step = Math.max(1, Math.round(ROW / G / 2.5));
    for (var gy = 0; gy < gh; gy += step) {
      for (var gx = 0; gx < gw; gx += step) {
        var k = gy * gw + gx;
        if (!mask[k] || occ[k]) continue;
        var dx = (D[k + 1] || 0) - (D[k - 1] || 0), dy = (D[k + gw] || 0) - (D[k - gw] || 0), l = Math.hypot(dx, dy) || 1;
        var tx = -dy / l, ty = dx / l, nx = dx / l, ny = dy / l;
        var cx = (gx + .5) * G, cy = (gy + .5) * G;
        for (var size = 0.8; size >= 0.45; size -= 0.35) {
          var a = ROW * size * (0.8 + R() * 0.4) / 2, b = ROW * size * 0.85 / 2;
          var q = jitter([
            [cx - tx * a + nx * b, cy - ty * a + ny * b], [cx + tx * a + nx * b, cy + ty * a + ny * b],
            [cx + tx * a - nx * b, cy + ty * a - ny * b], [cx - tx * a - nx * b, cy - ty * a - ny * b]
          ], ROW * 0.06);
          if (tryTile(q, mask, 0.55, region)) break;
        }
      }
    }
  }


  function hull(pts) {
    var p = pts.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
    function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
    var lo = [], up = [];
    p.forEach(function (q) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); });
    p.slice().reverse().forEach(function (q) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); });
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  function polyArea(v) {
    var a = 0;
    for (var i = 0; i < v.length; i++) { var p = v[i], q = v[(i + 1) % v.length]; a += p[0] * q[1] - q[0] * p[1]; }
    return Math.abs(a) / 2;
  }
  function centroid(p) { var x = 0, y = 0; p.forEach(function (q) { x += q[0]; y += q[1]; }); return [x / p.length, y / p.length]; }
  function shrink(p, g) {
    var c = centroid(p);
    return p.map(function (v) {
      var dx = v[0] - c[0], dy = v[1] - c[1], l = Math.hypot(dx, dy) || 1, k = Math.max(0, l - g) / l;
      return [c[0] + dx * k, c[1] + dy * k];
    });
  }


  /* ---------- Construction d'une version ---------- */
  function build(V) {
    W = window.innerWidth; H = window.innerHeight;
    gw = Math.ceil(W / G); gh = Math.ceil(H / G);
    R = rng(41);
    pieces = [];
    var N = gw * gh, k, x, y;

    // Cadre : rectangle centré, au-dessus de la barre de choix.
    var m = 14, bottom = 66;
    var fr = { x0: m, y0: m, x1: W - m, y1: H - bottom };
    var fw = fr.x1 - fr.x0, fh = fr.y1 - fr.y0;
    var ROWB = Math.max(6, Math.min(16, Math.min(fw, fh) * 0.022));      // tesselle de fond
    var frameW = V.frame.length * ROWB;

    // Lettres.
    var off = document.createElement('canvas'); off.width = gw; off.height = gh;
    var o = off.getContext('2d', { willReadFrequently: true });
    function fnt(sz) { return V.font.indexOf('{s}') >= 0 ? V.font.replace('{s}', sz) : sz + 'px ' + V.font; }
    o.font = fnt(100);
    if ('letterSpacing' in o) o.letterSpacing = '6px';
    var innerW = fw - 2 * frameW - 2 * ROWB * 2, innerH = fh - 2 * frameW - 2 * ROWB * 2;
    var one = o.measureText(NAME).width / 100, words = NAME.split(' ');
    var two = Math.max.apply(null, words.map(function (w) { return o.measureText(w).width / 100; }));
    var fsOne = Math.min(innerW * 0.94 / one, innerH * 0.6), fsTwo = Math.min(innerW * 0.94 / two, innerH * 0.42);
    var lines = fsTwo > fsOne * 1.15 ? words : [NAME];
    FS = lines.length > 1 ? fsTwo : fsOne;
    GAP = Math.max(1.2, FS * 0.008);
    o.font = fnt(FS);
    if ('letterSpacing' in o) o.letterSpacing = Math.round(FS * 0.06) + 'px';
    var mt = o.measureText('M'), cap = mt.actualBoundingBoxAscent;
    var lineH = cap * 1.45, cy = (fr.y0 + fr.y1) / 2;
    o.save(); o.scale(1 / G, 1 / G);
    o.textAlign = 'center'; o.fillStyle = '#000';
    lines.forEach(function (t, i) {
      o.fillText(t, W / 2, cy - (lines.length - 1) * lineH / 2 + i * lineH + cap / 2);
    });
    o.restore();
    var img = o.getImageData(0, 0, gw, gh).data, F = new Uint8Array(N);
    for (k = 0; k < N; k++) F[k] = img[k * 4 + 3] > 120 ? 1 : 0;

    // Zones : lettres, contour, halo, fond, cadre.
    var notF = new Uint8Array(N); for (k = 0; k < N; k++) notF[k] = 1 - F[k];
    var dOut = edt(notF, gw, gh);
    var ROWL = Math.max(5, FS * V.stroke);
    var ROWO = Math.max(4, ROWB * 0.85);
    var Fr = new Uint8Array(N), DFr = new Float32Array(N), O = new Uint8Array(N), Ha = new Uint8Array(N), B = new Uint8Array(N);
    var lineEnd = ROWO, haloEnd = ROWO + V.halo * ROWB;
    for (y = 0; y < gh; y++) for (x = 0; x < gw; x++) {
      k = y * gw + x;
      var px = (x + .5) * G, py = (y + .5) * G;
      var dfr = Math.min(px - fr.x0, fr.x1 - px, py - fr.y0, fr.y1 - py);
      DFr[k] = dfr;
      if (dfr < 0) continue;
      if (dfr < frameW) { Fr[k] = 1; continue; }
      if (F[k]) continue;
      if (dOut[k] <= lineEnd) O[k] = 1;
      else if (dOut[k] <= haloEnd) Ha[k] = 1;
      else B[k] = 1;
    }

    // Distance qui guide les rangées du fond.
    var DB = new Float32Array(N);
    if (V.fond === 'ecailles') {
      // Écailles (éventails) : chaque rangée recouvre la précédente, rangs concentriques.
      var Rs = ROWB * 7.5, sx = Rs * 2, sy = Rs * 0.95;
      for (y = 0; y < gh; y++) for (x = 0; x < gw; x++) {
        k = y * gw + x;
        if (!B[k]) continue;
        var qx = (x + .5) * G, qy = (y + .5) * G, best = -1e9, bd = 0;
        var j0 = Math.floor(qy / sy);
        for (var j = j0 + 1; j >= j0 - 1; j--) {
          var off2 = (j & 1) ? Rs : 0, i0 = Math.floor((qx - off2) / sx);
          for (var i = i0 - 1; i <= i0 + 2; i++) {
            var ccx = i * sx + off2, ccy = j * sy, d = Math.hypot(qx - ccx, qy - ccy);
            if (d < Rs && j > best) { best = j; bd = Rs - d; }
          }
          if (best > -1e9) break;
        }
        DB[k] = bd;
      }
    } else {
      for (y = 0; y < gh; y++) for (x = 0; x < gw; x++) DB[y * gw + x] = (y + .5) * G + Math.sin(x * G / (ROWB * 9)) * ROWB * 0.4;
    }

    // Pose, zone par zone.
    occ = new Uint8Array(N);
    function lay(mask, D, row, lenK, kind, ringD) {
      var start = pieces.length;
      ROW = Math.max(row, 4);
      layRows(mask, D, kind, lenK);
      fillGaps(mask, D, kind);
      for (var n = start; n < pieces.length; n++) {
        var p = pieces[n], gx = clamp((p.c[0] / G) | 0, 0, gw - 1), gy = clamp((p.c[1] / G) | 0, 0, gh - 1);
        p.ring = Math.floor((ringD || D)[gy * gw + gx] / ROW);
      }
    }
    var DFin = edt(F, gw, gh);
    lay(F, DFin, ROWL, 1.0, 'letter');
    var DO = new Float32Array(N); for (k = 0; k < N; k++) DO[k] = dOut[k];
    lay(O, DO, ROWO, 1.4, 'line');
    var DH = new Float32Array(N); for (k = 0; k < N; k++) DH[k] = dOut[k] - lineEnd;
    lay(Ha, DH, ROWB, 1.2, 'halo');
    lay(Fr, DFr, ROWB, 1.25, 'frame');
    if (V.fond === 'ecailles') lay(B, DB, ROWB, 1.15, 'bg');
    else {
      // rangées horizontales : la fonction de distance donne directement les lignes
      ROW = ROWB;
      layRows(B, DB, 'bg', 1.05);
      fillGaps(B, edt(B, gw, gh), 'bg');
    }

    // Couleurs.
    pieces.forEach(function (p) {
      var col, r = R();
      if (p.kind === 'letter') col = r < 0.75 ? V.letter[(R() * V.letter.length) | 0] : V.letter2[(R() * V.letter2.length) | 0];
      else if (p.kind === 'line') col = pick(V.line);
      else if (p.kind === 'halo') col = pick(V.halo1);
      else if (p.kind === 'frame') col = pick(V.frame[clamp(p.ring, 0, V.frame.length - 1)]);
      else col = V.fond === 'ecailles' && p.ring % 4 === 0 ? pick(V.bgRing) : pick(V.bg);
      p.rgb = hex(col);
      p.tone = (R() - 0.5) * 0.08;
      var gx = clamp((p.c[0] / G) | 0, 0, gw - 1), gy = clamp((p.c[1] / G) | 0, 0, gh - 1), kk = gy * gw + gx;
      p.dl = F[kk] ? 0 : dOut[kk];
      p.df = DFr[kk];
    });
    // repère de chaque lettre (pour la pose lettre par lettre)
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    pieces.forEach(function (p) {
      if (p.kind !== 'letter') return;
      minX = Math.min(minX, p.c[0]); maxX = Math.max(maxX, p.c[0]); minY = Math.min(minY, p.c[1]); maxY = Math.max(maxY, p.c[1]);
    });
    info = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, rx: Math.max(1, (maxX - minX) / 2), ry: Math.max(1, (maxY - minY) / 2),
             minX: minX, maxX: maxX, fr: fr, maxDF: Math.min(fw, fh) / 2 };
    plan(V);
    return { pieces: pieces, info: info, FS: FS, W: W, H: H };
  }

  /* ---------- Ordre de pose ---------- */
  var IMPACT = 150;
  function plan(V) {
    var last = 0, maxDl = 1;
    pieces.forEach(function (p) {
      p.r1 = R(); p.r2 = R(); p.r3 = R(); p.r4 = R();
      if (p.kind === 'bg' || p.kind === 'halo') maxDl = Math.max(maxDl, p.dl);
    });
    var span = Math.max(1, info.maxX - info.minX);
    pieces.forEach(function (p) {
      var dn = Math.min(1.3, Math.hypot((p.c[0] - info.cx) / info.rx, (p.c[1] - info.cy) / (info.ry * 2)));
      var ln = (p.c[0] - info.minX) / span, dl = p.dl / maxDl, df = clamp(p.df / info.maxDF, 0, 1);
      var isL = p.kind === 'letter' || p.kind === 'line';
      var d;
      if (V.anim === 'centre') {
        d = isL ? 150 + dn * 1300 : p.kind === 'frame' ? 2300 + (1 - df) * 400 : 1100 + dn * 900 + dl * 700;
      } else if (V.anim === 'lettre') {
        // lettre après lettre, de gauche à droite ; chaque lettre se pose avec son halo
        d = isL ? 150 + ln * 2200 : p.kind === 'halo' ? 350 + clamp(ln, 0, 1) * 2200 + dl * 300 :
            p.kind === 'frame' ? 2700 + (p.c[0] / W) * 500 : 2300 + dl * 900;
      } else if (V.anim === 'fond') {
        // d'abord le cadre et le fond, des bords vers le centre, puis les lettres
        d = p.kind === 'frame' ? 100 + p.r1 * 300 : p.kind === 'bg' || p.kind === 'halo' ? 300 + df * 1500 :
            2000 + dn * 900;
      } else {
        // vague : les rangs s'enroulent autour des lettres, un anneau après l'autre
        d = isL ? 150 + ln * 900 : p.kind === 'frame' ? 2900 + (1 - df) * 300 : 900 + dl * 2000;
      }
      p.delay = d + p.r1 * 200;
      p.dur = 440 + p.r2 * 160;
      p.rot0 = (p.r3 - 0.5) * 2.4;
      p.tilt0 = 0.5 + p.r4 * 0.8;
      p.axis = p.r1 * Math.PI;
      p.lx = (p.r2 - 0.5) * FS * 0.6; p.ly = (p.r3 - 0.5) * FS * 0.4 - FS * 0.15;
      last = Math.max(last, p.delay + p.dur + IMPACT);
    });
    info.total = last;
  }

  /* ---------- Rendu ---------- */
  function path(c, q) {
    c.beginPath();
    c.moveTo(q[0][0], q[0][1]);
    for (var i = 1; i < q.length; i++) c.lineTo(q[i][0], q[i][1]);
    c.closePath();
  }

  function drawBase(V) {
    var c = bctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = V.page;
    c.fillRect(0, 0, W, H);
    var f = info.fr;
    c.fillStyle = V.grout;                                   // lit de mortier
    c.fillRect(f.x0, f.y0, f.x1 - f.x0, f.y1 - f.y0);
    var gr = rng(9);
    for (var i = 0; i < (f.x1 - f.x0) * (f.y1 - f.y0) / 70; i++) {
      c.fillStyle = gr() < 0.5 ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.08)';
      c.fillRect(f.x0 + gr() * (f.x1 - f.x0), f.y0 + gr() * (f.y1 - f.y0), 1.5, 1.5);
    }
  }

  function placeOnBed(p) {
    var c = bctx, q = p.q, minI = 0, maxI = 0;
    for (var i = 1; i < q.length; i++) {
      if (q[i][0] + q[i][1] < q[minI][0] + q[minI][1]) minI = i;
      if (q[i][0] + q[i][1] > q[maxI][0] + q[maxI][1]) maxI = i;
    }
    var g = c.createLinearGradient(q[minI][0], q[minI][1], q[maxI][0], q[maxI][1]);
    g.addColorStop(0, css(p.rgb, p.tone + 0.12));
    g.addColorStop(0.55, css(p.rgb, p.tone));
    g.addColorStop(1, css(p.rgb, p.tone - 0.1));
    c.fillStyle = g;
    path(c, q); c.fill();
  }

  function drawFlying(p, prog, impact) {
    var h = impact >= 0 ? 0 : 1 - prog * prog;
    var persp = 1 / (1 - h * 0.8);
    var scale = persp * (impact >= 0 ? 1 - 0.06 * Math.sin(impact * Math.PI) : 1);
    var px = p.c[0] + (p.c[0] - W / 2) * (persp - 1) * 0.25 + p.lx * h;
    var py = p.c[1] + (p.c[1] - H / 2) * (persp - 1) * 0.25 + p.ly * h;
    var rot = p.rot0 * h, tilt = Math.cos(p.tilt0 * h);
    var ca = Math.cos(p.axis), sa = Math.sin(p.axis), cr = Math.cos(rot), sr = Math.sin(rot);
    function tf(v) {
      var x = v[0] - p.c[0], y = v[1] - p.c[1];
      var along = (x * ca + y * sa) * tilt, across = -x * sa + y * ca;
      x = (along * ca - across * sa) * scale; y = (along * sa + across * ca) * scale;
      return [px + x * cr - y * sr, py + x * sr + y * cr];
    }
    var alpha = Math.min(1, prog * 5) * (0.55 + 0.45 * (1 - h));
    if (h > 0.001) {
      ctx.globalAlpha = 0.05 + 0.25 * Math.pow(1 - h, 2);
      ctx.fillStyle = '#000';
      path(ctx, p.q.map(function (v) { return [v[0] + h * FS * 0.2, v[1] + h * FS * 0.3]; }));
      ctx.fill();
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = css(p.rgb, p.tone);
    path(ctx, p.q.map(tf));
    ctx.fill();
    var shade = (1 - Math.abs(tilt)) * 0.45;
    if (shade > 0.02) { ctx.globalAlpha = alpha * shade; ctx.fillStyle = '#000'; ctx.fill(); }
    if (impact >= 0 && impact < 0.6) { ctx.globalAlpha = 0.35 * (1 - impact / 0.6); ctx.fillStyle = '#fff'; ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    var time = now - t0, flying = [];
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      if (p.placed) continue;
      var tau = time - p.delay;
      if (tau < 0) continue;
      if (tau > p.dur + IMPACT) { placeOnBed(p); p.placed = true; continue; }
      flying.push(p);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bed, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    flying.sort(function (a, b) { return (time - b.delay) / b.dur - (time - a.delay) / a.dur; });
    for (var j = 0; j < flying.length; j++) {
      var f = flying[j], tt = time - f.delay;
      if (tt <= f.dur) drawFlying(f, tt / f.dur, -1); else drawFlying(f, 1, (tt - f.dur) / IMPACT);
    }
    if (time < info.total + 300) requestAnimationFrame(frame);
    else { running = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0); }
  }

  function play() {
    var V = VARIANTS[variant];
    var key = variant + ':' + window.innerWidth + 'x' + window.innerHeight;
    if (!cache[key]) cache[key] = build(V);
    var c = cache[key];
    pieces = c.pieces; info = c.info; FS = c.FS; W = c.W; H = c.H;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = bed.width = Math.round(W * DPR);
    canvas.height = bed.height = Math.round(H * DPR);
    document.body.style.background = V.page;
    drawBase(V);
    pieces.forEach(function (p) { p.placed = false; });
    if (reduceMotion) {
      pieces.forEach(function (p) { placeOnBed(p); p.placed = true; });
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0);
      return;
    }
    t0 = performance.now();
    if (!running) { running = true; requestAnimationFrame(frame); }
    window.__count = pieces.length;
  }

  function choose(v) {
    variant = v;
    document.querySelectorAll('[data-v]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === v ? 'true' : 'false'); });
    play();
  }
  document.querySelectorAll('[data-v]').forEach(function (b) {
    b.addEventListener('click', function () { choose(b.getAttribute('data-v')); });
  });
  document.getElementById('rejouer').addEventListener('click', play);
  window.addEventListener('keydown', function (e) {
    var keys = { '1': 'metro', '2': 'ancien', '3': 'nuit', '4': 'faience' };
    if (keys[e.key]) choose(keys[e.key]);
    else if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); play(); }
  });
  var timer, lastW = 0, lastH = 0, started = false;
  window.addEventListener('resize', function () {
    if (!started) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 60) return;
      lastW = window.innerWidth; lastH = window.innerHeight;
      cache = {}; play();
    }, 250);
  });

  var fonts = ['100px "Limelight"', '100px "Metamorphous"', '100px "Poller One"', '900 100px "Playfair Display SC"'];
  var ready = document.fonts && document.fonts.load ? Promise.all(fonts.map(function (f) { return document.fonts.load(f).catch(function () {}); })) : Promise.resolve();
  var go = function () { if (started) return; started = true; lastW = window.innerWidth; lastH = window.innerHeight; play(); };
  ready.then(go, go);
  setTimeout(go, 3000);
})();
</script>
