<title>Galvez Martin en mosaïque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Une seule scène : un pavement grec, une bordure à grecque, le nom posé en éclats. */
  :root {
    --floor: #ece4d3;
    --panel: rgba(30, 46, 62, .82);
    --panel-ink: #f5efe3;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--floor); color: var(--panel-ink); font-family: var(--ui); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 6px; border-radius: 14px;
  }
  .controls button {
    font: 600 14px/1 var(--ui); color: var(--panel-ink); background: transparent; border: 0; cursor: pointer;
    padding: 10px 16px; border-radius: 9px; white-space: nowrap;
  }
  .controls button:hover { background: rgba(255, 255, 255, .12); }
  .controls button:focus-visible { outline: 2px solid var(--panel-ink); outline-offset: 1px; }
</style>

<canvas id="mur" role="img" aria-label="Galvez Martin, en mosaïque à la grecque"></canvas>
<div class="controls"><button type="button" id="rejouer">↻ Rejouer</button></div>

<script>
(function () {
  'use strict';

  /* ---------- Palette : bleus et verts de Provence, fond de pierre calcaire ---------- */
  var BLUES = ['#2e5f94', '#264f7d', '#3b75ad', '#4f87bd', '#1f416a', '#6a9ccc'];
  var GREENS = ['#5f7d3a', '#6e8a3e', '#4f6b30', '#7f9c5a', '#4f7a63', '#8fb39a'];
  var STONE = ['#efe7d6', '#ebe2cf', '#f3ecdf', '#e6dcc6', '#f0e9da'];
  var GROUT = '#cdbfa6';
  var LETTER_GROUT = '#2a3036';
  var FRAME_BLUE = ['#2e5f94', '#2a5788', '#34679c'];
  var FRAME_GREEN = ['#6e8a3e', '#647f37', '#78944a'];

  // Grecque : une spirale par période de 6 tesselles, sur 5 rangs.
  var KEY = ['XXXXX.', 'X...X.', 'X.XXX.', 'X.....', 'XXXXXX'];

  var canvas = document.getElementById('mur');
  var ctx = canvas.getContext('2d');
  var bed = document.createElement('canvas');
  var bctx = bed.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR, FS, T, GAP;
  var pieces = [], info = {}, frame = null;
  var t0 = 0, running = false;

  /* ---------- Outils ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var R = rng(1);
  function pick(a) { return a[(R() * a.length) | 0]; }
  function inPoly(p, x, y) {
    var c = false;
    for (var i = 0, j = p.length - 1; i < p.length; j = i++) {
      var a = p[i], b = p[j];
      if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  // Coupe un polygone convexe par une droite (point + direction) : deux polygones convexes.
  function cut(poly, px, py, dx, dy) {
    var A = [], B = [], n = poly.length;
    function side(v) { return (v[0] - px) * dy - (v[1] - py) * dx; }
    for (var i = 0; i < n; i++) {
      var a = poly[i], b = poly[(i + 1) % n], sa = side(a), sb = side(b);
      if (sa >= 0) A.push(a); else B.push(a);
      if ((sa >= 0) !== (sb >= 0)) {
        var t = sa / (sa - sb), m = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        A.push(m); B.push(m);
      }
    }
    return [A, B];
  }
  // Recule chaque côté d'un polygone convexe de d (joint entre éclats).
  function inset(p, d) {
    var n = p.length, s = 0, out = [], lines = [], i;
    for (i = 0; i < n; i++) { var a = p[i], b = p[(i + 1) % n]; s += a[0] * b[1] - b[0] * a[1]; }
    var dir = s > 0 ? 1 : -1;
    for (i = 0; i < n; i++) {
      var a2 = p[i], b2 = p[(i + 1) % n], dx = b2[0] - a2[0], dy = b2[1] - a2[1], l = Math.hypot(dx, dy) || 1;
      lines.push([a2[0] - dy / l * dir * d, a2[1] + dx / l * dir * d, dx, dy]);
    }
    for (i = 0; i < n; i++) {
      var L1 = lines[(i - 1 + n) % n], L2 = lines[i], den = L1[2] * L2[3] - L1[3] * L2[2];
      if (Math.abs(den) < 1e-9) { out.push([L2[0], L2[1]]); continue; }
      var t = ((L2[0] - L1[0]) * L2[3] - (L2[1] - L1[1]) * L2[2]) / den;
      out.push([L1[0] + L1[2] * t, L1[1] + L1[3] * t]);
    }
    return out;
  }

  /* ---------- Mise en page : le nom, puis le cadre autour ---------- */
  function font(italic, size) { return (italic ? 'italic ' : '') + '400 ' + size + 'px "Instrument Serif", "Times New Roman", serif'; }

  function layout() {
    var m = document.createElement('canvas').getContext('2d');
    T = Math.round(Math.max(6, Math.min(12, Math.min(W, H) * 0.013)));   // tesselle du pavement
    var band = 9 * T, margin = 16, bottomUI = 70;
    var availW = W - 2 * margin - 2 * band, availH = H - margin - bottomUI - 2 * band;
    var words = [{ t: 'Galvez', it: false }, { t: 'Martin', it: true }];
    function width(wd, size) { m.font = font(wd.it, size); return m.measureText(wd.t).width; }
    var space = 0.22;
    var oneW = width(words[0], 100) + width(words[1], 100) + space * 100;
    var twoW = Math.max(width(words[0], 100), width(words[1], 100));
    var padX = 0.32, padY = 0.3;                                   // marges intérieures, en hauteur de lettre
    var fsOne = Math.min(availW / (oneW / 100 + 2 * padX), availH / (0.95 + 2 * padY));
    var fsTwo = Math.min(availW / (twoW / 100 + 2 * padX), availH / (1.85 + 2 * padY));
    var two = fsTwo > fsOne * 1.25;
    FS = Math.min(two ? fsTwo : fsOne, 230);
    GAP = Math.max(2.5, FS * 0.022);

    // Position de chaque lettre.
    var glyphs = [];
    var lines = two ? [[words[0]], [words[1]]] : [[words[0], words[1]]];
    var lineH = FS * 0.95, blockH = lines.length * lineH;
    var baseY = H / 2 - bottomUI / 2 + margin / 2 - blockH / 2 + FS * 0.74;
    lines.forEach(function (line, li) {
      var total = line.reduce(function (s, wd, i) { return s + width(wd, FS) + (i ? space * FS : 0); }, 0);
      var x = W / 2 - total / 2;
      line.forEach(function (wd, wi) {
        if (wi) x += space * FS;
        m.font = font(wd.it, FS);
        // On place les lettres une à une, en gardant l'approche du mot.
        Array.from(wd.t).forEach(function (ch, ci) {
          var before = m.measureText(wd.t.slice(0, ci)).width;
          var mt = m.measureText(ch);
          glyphs.push({ ch: ch, it: wd.it, x: x + before, y: baseY + li * lineH, m: mt, word: wd.it ? 1 : 0 });
        });
        x += width(wd, FS);
      });
    });

    // Cadre aligné sur la grille des tesselles.
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    glyphs.forEach(function (g) {
      minX = Math.min(minX, g.x - g.m.actualBoundingBoxLeft); maxX = Math.max(maxX, g.x + g.m.actualBoundingBoxRight);
      minY = Math.min(minY, g.y - g.m.actualBoundingBoxAscent); maxY = Math.max(maxY, g.y + g.m.actualBoundingBoxDescent);
    });
    var innerW = (maxX - minX) + 2 * padX * FS, innerH = (maxY - minY) + 2 * padY * FS;
    var cols = Math.ceil(innerW / T / 6) * 6, rows = Math.ceil(innerH / T / 6) * 6;  // périodes entières de grecque
    var gx = Math.round(((minX + maxX) / 2) / T - cols / 2) - 9;
    var gy = Math.round(((minY + maxY) / 2) / T - rows / 2) - 9;
    frame = { L: gx, T: gy, R: gx + cols + 17, B: gy + rows + 17 };
    info = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, rx: (maxX - minX) / 2, ry: (maxY - minY) / 2 };
    return glyphs;
  }

  /* ---------- Pavement et bordure ---------- */
  function frameColor(i, j) {
    var f = frame;
    if (i < f.L || i > f.R || j < f.T || j > f.B) return null;
    var dl = i - f.L, dr = f.R - i, dt = j - f.T, db = f.B - j;
    var u = Math.min(dl, dr), v = Math.min(dt, db);
    if (u >= 9 && v >= 9) return null;
    if (u < 9 && v < 9) {                                // coins : carré concentrique
      if (u === 0 || v === 0 || u === 8 || v === 8) return pick(FRAME_GREEN);
      if (u >= 2 && u <= 6 && v >= 2 && v <= 6 && (u === 2 || u === 6 || v === 2 || v === 6 || (u === 4 && v === 4))) return pick(FRAME_BLUE);
      return null;
    }
    var r, k;
    if (v < 9) { r = v; k = (i - (f.L + 9)) % 6; } else { r = u; k = (j - (f.T + 9)) % 6; }
    if (r === 0 || r === 8) return pick(FRAME_GREEN);
    if (r >= 2 && r <= 6 && KEY[r - 2][(k + 6) % 6] === 'X') return pick(FRAME_BLUE);
    return null;
  }

  function drawFloor() {
    var c = bctx, gr = rng(4);
    var saved = R; R = gr;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = GROUT;
    c.fillRect(0, 0, W, H);
    var cols = Math.ceil(W / T) + 1, rows = Math.ceil(H / T) + 1, g = Math.max(1, T * 0.14);
    for (var j = 0; j < rows; j++) {
      for (var i = 0; i < cols; i++) {
        var col = frameColor(i, j) || pick(STONE);
        var jx = (gr() - 0.5) * T * 0.12, jy = (gr() - 0.5) * T * 0.12, s = T - g;
        c.fillStyle = col;
        c.fillRect(i * T + g / 2 + jx, j * T + g / 2 + jy, s * (0.92 + gr() * 0.08), s * (0.92 + gr() * 0.08));
      }
    }
    R = saved;
  }

  /* ---------- Les lettres découpées en 3 ou 4 éclats ---------- */
  function build() {
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = bed.width = Math.round(W * DPR);
    canvas.height = bed.height = Math.round(H * DPR);
    R = rng(31);
    pieces = [];
    var glyphs = layout();
    var tIn = Math.max(4, FS * 0.032);                     // tesselles à l'intérieur des lettres

    glyphs.forEach(function (g, gi) {
      var pad = FS * 0.06;
      var x0 = Math.floor(g.x - g.m.actualBoundingBoxLeft - pad), y0 = Math.floor(g.y - g.m.actualBoundingBoxAscent - pad);
      var x1 = Math.ceil(g.x + g.m.actualBoundingBoxRight + pad), y1 = Math.ceil(g.y + g.m.actualBoundingBoxDescent + pad);
      var w = x1 - x0, h = y1 - y0;

      // Masque de la lettre, pour savoir où est l'encre.
      var mk = document.createElement('canvas'); mk.width = w; mk.height = h;
      var mc = mk.getContext('2d', { willReadFrequently: true });
      mc.font = font(g.it, FS); mc.fillStyle = '#000';
      mc.fillText(g.ch, g.x - x0, g.y - y0);
      var data = mc.getImageData(0, 0, w, h).data;
      var ink = [];
      for (var yy = 0; yy < h; yy += 2) for (var xx = 0; xx < w; xx += 2) if (data[(yy * w + xx) * 4 + 3] > 100) ink.push([xx + x0, yy + y0]);
      function inkIn(poly) { var n = 0; ink.forEach(function (p) { if (inPoly(poly, p[0], p[1])) n++; }); return n; }

      // Coupes droites successives à travers la lettre.
      var want = R() < 0.5 ? 3 : 4;
      var cells = [[[x0, y0], [x1, y0], [x1, y1], [x0, y1]]];
      var guard = 0;
      while (cells.length < want && guard++ < 80) {
        var counts = cells.map(inkIn), bi = counts.indexOf(Math.max.apply(null, counts));
        var cell = cells[bi];
        var pts = ink.filter(function (p) { return inPoly(cell, p[0], p[1]); });
        if (pts.length < 8) break;
        var mx = 0, my = 0; pts.forEach(function (p) { mx += p[0]; my += p[1]; }); mx /= pts.length; my /= pts.length;
        var ang = (R() < 0.6 ? 0 : Math.PI / 2) + (R() - 0.5) * 1.3;
        var off = (R() - 0.5) * FS * 0.15;
        var halves = cut(cell, mx + Math.cos(ang + Math.PI / 2) * off, my + Math.sin(ang + Math.PI / 2) * off, Math.cos(ang), Math.sin(ang));
        if (halves[0].length < 3 || halves[1].length < 3) continue;
        var ia = inkIn(halves[0]), ib = inkIn(halves[1]);
        if (Math.min(ia, ib) < ink.length * 0.12) continue;      // chaque éclat garde un vrai morceau de lettre
        cells.splice(bi, 1, halves[0], halves[1]);
      }

      var family = g.word ? GREENS : BLUES;
      cells.forEach(function (cell) {
        var poly = inset(cell, GAP / 2);
        var tone = R();
        var cv = document.createElement('canvas');
        cv.width = Math.ceil(w * DPR); cv.height = Math.ceil(h * DPR);
        var c = cv.getContext('2d');
        c.scale(DPR, DPR); c.translate(-x0, -y0);
        c.beginPath(); poly.forEach(function (p, k) { if (k) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); }); c.closePath();
        c.clip();
        c.font = font(g.it, FS);
        c.fillStyle = LETTER_GROUT;
        c.fillText(g.ch, g.x, g.y);
        // Tesselles dans la lettre, sur une grille commune à tout le nom.
        c.globalCompositeOperation = 'source-atop';
        var gg = Math.max(0.8, tIn * 0.16);
        for (var ty = Math.floor(y0 / tIn) * tIn; ty < y1; ty += tIn) {
          for (var tx = Math.floor(x0 / tIn) * tIn; tx < x1; tx += tIn) {
            var col = R() < 0.75 ? family[Math.floor(tone * 3) % family.length] : pick(family);
            c.fillStyle = col;
            c.fillRect(tx + gg / 2 + (R() - .5) * tIn * 0.1, ty + gg / 2 + (R() - .5) * tIn * 0.1, tIn - gg, tIn - gg);
          }
        }
        // Lumière rasante : haut plus clair.
        var grd = c.createLinearGradient(0, y0, 0, y1);
        grd.addColorStop(0, 'rgba(255,255,255,.16)'); grd.addColorStop(1, 'rgba(0,0,0,.1)');
        c.fillStyle = grd; c.fillRect(x0, y0, w, h);
        // Ombre portée pré-calculée (silhouette).
        var sh = document.createElement('canvas'); sh.width = cv.width; sh.height = cv.height;
        var sc = sh.getContext('2d');
        sc.drawImage(cv, 0, 0); sc.globalCompositeOperation = 'source-in';
        sc.fillStyle = 'rgb(60,45,25)'; sc.fillRect(0, 0, sh.width, sh.height);
        var cx = 0, cy = 0; poly.forEach(function (p) { cx += p[0]; cy += p[1]; }); cx /= poly.length; cy /= poly.length;
        pieces.push({ img: cv, shadow: sh, x0: x0, y0: y0, w: w, h: h, c: [cx, cy] });
      });
    });
    info.count = pieces.length;
    plan();
  }

  /* ---------- Animation : même chute, du spectateur vers le mur, du centre vers les bords ---------- */
  var IMPACT = 170;
  function plan() {
    var last = 0;
    pieces.forEach(function (p) {
      p.r1 = R(); p.r2 = R(); p.r3 = R(); p.r4 = R();
      var dn = Math.min(1, Math.hypot((p.c[0] - info.cx) / info.rx, (p.c[1] - info.cy) / (info.ry * 1.6)));
      p.delay = 200 + dn * 1700 + p.r1 * 180;
      p.dur = 560 + p.r2 * 160;
      p.rot0 = (p.r3 - 0.5) * 3;
      p.tilt0 = 0.5 + p.r4 * 0.8;
      p.axis = p.r1 * Math.PI;
      p.lx = (p.r2 - 0.5) * FS * 1.1; p.ly = (p.r3 - 0.5) * FS * 0.7 - FS * 0.3;
      p.placed = false; p.hit = false;
      last = Math.max(last, p.delay + p.dur + IMPACT);
    });
    info.total = last;
  }

  function drawPieceAt(c, p, img, px, py, scale, rot, tilt, alpha) {
    c.save();
    c.globalAlpha = alpha;
    c.translate(px, py);
    c.rotate(rot + p.axis);
    c.scale(tilt * scale, scale);
    c.rotate(-p.axis);
    c.drawImage(img, p.x0 - p.c[0], p.y0 - p.c[1], p.w, p.h);
    c.restore();
  }

  function placeOnBed(p) {
    bctx.save();
    bctx.globalAlpha = 0.28;
    bctx.drawImage(p.shadow, p.x0 + 1.2, p.y0 + 1.8, p.w, p.h);
    bctx.restore();
    bctx.drawImage(p.img, p.x0, p.y0, p.w, p.h);
  }

  function drawFlying(p, prog, impact) {
    var h = impact >= 0 ? 0 : 1 - prog * prog;
    var persp = 1 / (1 - h * 0.82);
    var scale = persp * (impact >= 0 ? 1 - 0.05 * Math.sin(impact * Math.PI) : 1);
    var px = p.c[0] + (p.c[0] - W / 2) * (persp - 1) * 0.22 + p.lx * h;
    var py = p.c[1] + (p.c[1] - H / 2) * (persp - 1) * 0.22 + p.ly * h;
    var rot = p.rot0 * h, tilt = Math.cos(p.tilt0 * h);
    if (h > 0.001) {                                       // ombre sur le pavement
      drawPieceAt(ctx, p, p.shadow, p.c[0] + h * FS * 0.35, p.c[1] + h * FS * 0.5, 1 + h * 0.5, rot, tilt, 0.06 + 0.3 * Math.pow(1 - h, 2));
    }
    var alpha = Math.min(1, prog * 5) * (0.6 + 0.4 * (1 - h));
    drawPieceAt(ctx, p, p.img, px, py, scale, rot, tilt, alpha);
    var shade = (1 - Math.abs(tilt)) * 0.5;
    if (shade > 0.02) drawPieceAt(ctx, p, p.shadow, px, py, scale, rot, tilt, alpha * shade);
    if (impact >= 0 && impact < 0.6) {                     // éclat de lumière à l'impact
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawPieceAt(ctx, p, p.img, px, py, scale, rot, tilt, 0.35 * (1 - impact / 0.6));
      ctx.restore();
    }
  }

  var shake = 0;
  function frameStep(now) {
    var time = now - t0, flying = [], hits = 0;
    bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    pieces.forEach(function (p) {
      if (p.placed) return;
      var tau = time - p.delay;
      if (tau < 0) return;
      if (tau > p.dur + IMPACT) { placeOnBed(p); p.placed = true; return; }
      if (tau > p.dur && !p.hit) { p.hit = true; hits++; }
      flying.push(p);
    });
    shake = Math.min(8, shake * 0.8 + hits * 2.2);
    var ox = (Math.random() - 0.5) * shake, oy = (Math.random() - 0.5) * shake;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = GROUT;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bed, ox * DPR, oy * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, ox * DPR, oy * DPR);
    flying.sort(function (a, b) { return (time - b.delay) / b.dur - (time - a.delay) / a.dur; });
    flying.forEach(function (p) {
      var tt = time - p.delay;
      if (tt <= p.dur) drawFlying(p, tt / p.dur, -1); else drawFlying(p, 1, (tt - p.dur) / IMPACT);
    });
    if (time < info.total + 400) requestAnimationFrame(frameStep);
    else { running = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0); }
  }

  function play() {
    drawFloor();
    pieces.forEach(function (p) { p.placed = false; p.hit = false; });
    if (reduceMotion) {
      pieces.forEach(function (p) { placeOnBed(p); p.placed = true; });
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0);
      return;
    }
    t0 = performance.now();
    if (!running) { running = true; requestAnimationFrame(frameStep); }
  }

  document.getElementById('rejouer').addEventListener('click', play);
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); play(); }
  });
  var timer, lastW = 0, lastH = 0;
  window.addEventListener('resize', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 60) return;
      lastW = window.innerWidth; lastH = window.innerHeight;
      build(); play();
    }, 250);
  });

  var started = false;
  function go() {
    if (started) return;
    started = true; lastW = window.innerWidth; lastH = window.innerHeight;
    build(); play();
    window.__count = pieces.length;
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('400 100px "Instrument Serif"'),
      document.fonts.load('italic 400 100px "Instrument Serif"')
    ]).then(go, go);
    setTimeout(go, 2500);
  } else go();
})();
</script>
