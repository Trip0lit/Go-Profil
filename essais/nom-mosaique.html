<meta charset="utf-8">
<title>Galvez Martin en mosaïque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Archivo:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Une seule scène : fond noir, le nom en mosaïque verte ; G et A sont les photos d'origine. */
  :root {
    --wall: #0b0a0d;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --tag: #f2efe8;
    --tag-soft: rgba(242, 239, 232, .5);
    --accent: #8fd88a;
    --panel: rgba(20, 30, 24, .85);
    --panel-ink: #f6f1ea;
    --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--wall); color: var(--panel-ink); font-family: var(--ui); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .tag {
    position: fixed; margin: 0; font: 700 11px/1.5 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    color: var(--tag-soft); pointer-events: none;
  }
  .tag b { color: var(--tag); font-weight: 700; }
  .tag i { font-style: normal; color: var(--accent); }
  .tl { top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; }
  .tr { top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; text-align: right; }
  .bl { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 16px; }
  .br { bottom: calc(22px + env(safe-area-inset-bottom, 0px)); right: 16px; text-align: right; }
  @media (max-width: 520px) { .bl, .br { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } }
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 6px; border-radius: 14px;
  }
  .controls button {
    font: 600 14px/1 var(--ui); color: var(--panel-ink); background: transparent; border: 0; cursor: pointer;
    padding: 10px 16px; border-radius: 9px; white-space: nowrap;
  }
  .controls button:hover { background: rgba(255, 255, 255, .12); }
  .controls button:focus-visible { outline: 2px solid var(--panel-ink); outline-offset: 1px; }
</style>

<canvas id="mur" role="img" aria-label="GALVEZ MARTIN, pièce de graffiti en mosaïque verte"></canvas>
<p class="tag tl"><b>GM</b> / 001<br>Galvez Martin</p>
<p class="tag tr"><b>Mosaïque</b><br>Série 02 <i>●</i></p>

<p class="tag br">Vert bouteille<br><b>Édition 2026</b></p>
<div class="controls"><button type="button" id="rejouer">↻ Rejouer</button></div>

<script>
(function () {
  'use strict';

  /* ---------- Palette, relevée sur les lettres G et A ---------- */
  var WHITE = ['#f4f6f1', '#ecf1ea', '#ffffff', '#e4ede2', '#f8faf6'];
  var LIGHT = ['#b9e3b0', '#a8dba0', '#c7e9bf', '#9fd496', '#b2dfa9'];
  var MID = ['#7fc77a', '#6dbb6b', '#8ccf86', '#62b062', '#77c274'];
  var TEAL = ['#4fb7a0', '#5cc2aa', '#3fa58f', '#6ccbb4'];
  var DEEP = ['#2f7d55', '#286e4a', '#367f5a', '#1f5c3e'];
  var DARK = ['#174a33', '#123d2a', '#1b5238', '#0f3323', '#21573c'];
  var BLACK = ['#0d1210', '#111815', '#0a0e0c'];
  var GROUT = '#0f1311';
  var WALL = '#0b0a0d';

  var FONT = '"Titan One", "Arial Black", sans-serif';
  // Le nom : G et A sont les photos, le reste est posé par le programme.
  var NAME = [['G', 'A', 'L', 'V', 'E', 'Z'], ['M', 'A', 'R', 'T', 'I', 'N']];
  var PHOTOS = { G: { src: 'lettres/G.png', h: 1.42, dy: -0.12 }, A: { src: 'lettres/A.png', h: 1.3, dy: -0.04 } };
  var V = { tol: 0.012, spike: 0.16, spikeAngle: 105 };
  var SZ = 1.28;                                          // taille de police / hauteur de lettre   // pointes sur les angles vifs

  var canvas = document.getElementById('mur');
  var ctx = canvas.getContext('2d');
  var bed = document.createElement('canvas');
  var bctx = bed.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR, G = 2, gw, gh, FS, GAP;
  var pieces = [], info = {}, imgs = {}, photoSlots = [];
  var t0 = 0, running = false;

  /* ---------- Hasard reproductible ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var R = rng(1);
  function pick(arr) { return arr[(R() * arr.length) | 0]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function hex(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function css(c, k) {
    k = k || 0;
    var t = k > 0 ? 255 : 0, a = Math.abs(k);
    return 'rgb(' + ((c[0] + (t - c[0]) * a) | 0) + ',' + ((c[1] + (t - c[1]) * a) | 0) + ',' + ((c[2] + (t - c[2]) * a) | 0) + ')';
  }

  /* ---------- Transformée de distance euclidienne exacte (Felzenszwalb) ---------- */
  var BIG = 1e12;
  function edt(inside, w, h) {
    // Pour chaque case « dedans », distance à la case « dehors » la plus proche.
    var f = new Float64Array(Math.max(w, h)), d = new Float64Array(Math.max(w, h));
    var v = new Int32Array(Math.max(w, h)), z = new Float64Array(Math.max(w, h) + 1);
    var grid = new Float64Array(w * h), out = new Float32Array(w * h), x, y, n;
    for (var i = 0; i < w * h; i++) grid[i] = inside[i] ? BIG : 0;
    function pass(n) {
      var k = 0, q, s;
      v[0] = 0; z[0] = -BIG; z[1] = BIG;
      for (q = 1; q < n; q++) {
        s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
        while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
        k++; v[k] = q; z[k] = s; z[k + 1] = BIG;
      }
      k = 0;
      for (q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
    }
    for (x = 0; x < w; x++) {
      for (y = 0; y < h; y++) f[y] = grid[y * w + x];
      pass(h);
      for (y = 0; y < h; y++) grid[y * w + x] = d[y];
    }
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) f[x] = grid[y * w + x];
      pass(w);
      for (x = 0; x < w; x++) out[y * w + x] = Math.sqrt(d[x]) * G;
    }
    return out;
  }

  /* ---------- Courbes de niveau (marching squares) ---------- */
  var CASES = [[], [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], null, [[0, 2]], [[2, 3]],
               [[2, 3]], [[0, 2]], null, [[1, 2]], [[3, 1]], [[0, 1]], [[3, 0]], []];
  function contours(D, w, h, level) {
    var pts = new Map(), adj = new Map();
    function key(i, j, e) {
      // arête haute/basse : horizontale ; gauche/droite : verticale
      if (e === 0) return (j * w + i) * 2;
      if (e === 2) return ((j + 1) * w + i) * 2;
      if (e === 3) return (j * w + i) * 2 + 1;
      return (j * w + i + 1) * 2 + 1;
    }
    function point(i, j, e, a, b, c, d) {
      var t;
      if (e === 0) { t = (level - a) / (b - a); return [i + t, j]; }
      if (e === 1) { t = (level - b) / (c - b); return [i + 1, j + t]; }
      if (e === 2) { t = (level - d) / (c - d); return [i + t, j + 1]; }
      t = (level - a) / (d - a); return [i, j + t];
    }
    function link(k1, k2) {
      (adj.get(k1) || adj.set(k1, []).get(k1)).push(k2);
      (adj.get(k2) || adj.set(k2, []).get(k2)).push(k1);
    }
    for (var j = 0; j < h - 1; j++) {
      for (var i = 0; i < w - 1; i++) {
        var a = D[j * w + i], b = D[j * w + i + 1], c = D[(j + 1) * w + i + 1], d = D[(j + 1) * w + i];
        var idx = (a >= level ? 1 : 0) | (b >= level ? 2 : 0) | (c >= level ? 4 : 0) | (d >= level ? 8 : 0);
        if (idx === 0 || idx === 15) continue;
        var segs = CASES[idx];
        if (!segs) {
          var centre = (a + b + c + d) / 4 >= level;
          segs = idx === 5 ? (centre ? [[0, 1], [2, 3]] : [[3, 0], [1, 2]])
                           : (centre ? [[3, 0], [1, 2]] : [[0, 1], [2, 3]]);
        }
        for (var s = 0; s < segs.length; s++) {
          var e1 = segs[s][0], e2 = segs[s][1], k1 = key(i, j, e1), k2 = key(i, j, e2);
          if (!pts.has(k1)) pts.set(k1, point(i, j, e1, a, b, c, d));
          if (!pts.has(k2)) pts.set(k2, point(i, j, e2, a, b, c, d));
          link(k1, k2);
        }
      }
    }
    // Assemble les segments en polylignes.
    var used = new Set(), lines = [];
    function walk(start, prev, out) {
      var cur = start, p = prev;
      for (;;) {
        var nb = adj.get(cur), next = null;
        for (var n = 0; n < nb.length; n++) {
          var cand = nb[n];
          if (cand !== p && !used.has(edgeId(cur, cand))) { next = cand; break; }
        }
        if (next === null) return false;
        used.add(edgeId(cur, next));
        if (next === out[0] && out.length > 2) return true; // boucle fermée
        out.push(next); p = cur; cur = next;
      }
    }
    function edgeId(x, y) { return x < y ? x + ':' + y : y + ':' + x; }
    adj.forEach(function (nb, k) {
      for (var n = 0; n < nb.length; n++) {
        if (used.has(edgeId(k, nb[n]))) continue;
        used.add(edgeId(k, nb[n]));
        var fwd = [k, nb[n]];
        var closed = walk(nb[n], k, fwd);
        if (!closed) {
          var back = [k];
          walk(k, nb[n], back);
          fwd = back.reverse().concat(fwd.slice(1));
        }
        lines.push({ closed: closed, pts: fwd.map(function (kk) { var p = pts.get(kk); return [(p[0] + .5) * G, (p[1] + .5) * G]; }) });
      }
    });
    return lines;
  }

  function smooth(line) {
    var p = line.pts, n = p.length;
    if (n < 4) return p;
    for (var it = 0; it < 3; it++) {
      var q = [];
      for (var i = 0; i < n; i++) {
        var a = p[line.closed ? (i - 1 + n) % n : Math.max(0, i - 1)];
        var b = p[i];
        var c = p[line.closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
        q.push([(a[0] + 2 * b[0] + c[0]) / 4, (a[1] + 2 * b[1] + c[1]) / 4]);
      }
      p = q;
    }
    return p;
  }

  function rdp(pts, tol) {
    if (pts.length < 3) return pts.slice();
    var a = pts[0], b = pts[pts.length - 1], dmax = 0, idx = 0;
    var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    for (var i = 1; i < pts.length - 1; i++) {
      var d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + b[0] * a[1] - b[1] * a[0]) / l;
      if (d > dmax) { dmax = d; idx = i; }
    }
    if (dmax <= tol) return [a, b];
    var left = rdp(pts.slice(0, idx + 1), tol), right = rdp(pts.slice(idx), tol);
    return left.slice(0, -1).concat(right);
  }
  function rdpLoop(pts, tol) {
    var far = 0, dm = 0;
    for (var i = 1; i < pts.length; i++) {
      var d = Math.hypot(pts[i][0] - pts[0][0], pts[i][1] - pts[0][1]);
      if (d > dm) { dm = d; far = i; }
    }
    var a = rdp(pts.slice(0, far + 1), tol), b = rdp(pts.slice(far).concat([pts[0]]), tol);
    return a.slice(0, -1).concat(b.slice(0, -1));
  }

  function sharpen(F, V, fs) {
    var Ff = new Float32Array(F.length);
    for (var k = 0; k < F.length; k++) Ff[k] = F[k];
    var loops = contours(Ff, gw, gh, 0.5).filter(function (l) { return l.pts.length > 6; });
    var c = document.createElement('canvas'); c.width = gw; c.height = gh;
    var x = c.getContext('2d', { willReadFrequently: true });
    function inside(px, py) {
      var gx = (px / G) | 0, gy = (py / G) | 0;
      return gx >= 0 && gy >= 0 && gx < gw && gy < gh && F[gy * gw + gx];
    }
    x.beginPath();
    loops.forEach(function (l) {
      var p = rdpLoop(l.pts, fs * V.tol), n = p.length;
      if (n < 3) return;
      var out = [];
      for (var i = 0; i < n; i++) {
        var a = p[(i - 1 + n) % n], v = p[i], b = p[(i + 1) % n];
        var ax = a[0] - v[0], ay = a[1] - v[1], bx = b[0] - v[0], by = b[1] - v[1];
        var la = Math.hypot(ax, ay) || 1, lb = Math.hypot(bx, by) || 1;
        var ang = Math.acos(clamp((ax * bx + ay * by) / (la * lb), -1, 1)) * 180 / Math.PI;
        var mx = ax / la + bx / lb, my = ay / la + by / lb, ml = Math.hypot(mx, my) || 1;
        mx /= ml; my /= ml;
        // Coin saillant (le dedans de l'angle est plein) : on l'étire en pointe.
        if (ang < V.spikeAngle && inside(v[0] + mx * 3, v[1] + my * 3)) {
          var len = fs * V.spike * Math.pow(1 - ang / V.spikeAngle, 0.7) * (0.6 + R() * 0.8);
          out.push([v[0] - mx * len, v[1] - my * len]);
        } else out.push(v);
      }
      x.moveTo(out[0][0] / G, out[0][1] / G);
      for (var j = 1; j < out.length; j++) x.lineTo(out[j][0] / G, out[j][1] / G);
      x.closePath();
    });
    x.fillStyle = '#000';
    x.fill('evenodd');
    var img = x.getImageData(0, 0, gw, gh).data, S2 = new Uint8Array(F.length);
    for (k = 0; k < F.length; k++) S2[k] = img[k * 4 + 3] > 110 ? 1 : 0;
    return S2;
  }


  /* ---------- Pose en rangées qui suivent les formes (andamento) ----------
     Comme sur la mosaïque de référence : dans chaque zone, les éclats sont
     alignés en rangées parallèles au bord, puis les trous sont comblés. */
  var occ, ROW;

  function inQuad(q, x, y) {
    var sign = 0;
    for (var i = 0; i < 4; i++) {
      var a = q[i], b = q[(i + 1) % 4];
      var cr = (b[0] - a[0]) * (y - a[1]) - (b[1] - a[1]) * (x - a[0]);
      if (cr !== 0) { if (sign === 0) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return false; }
    }
    return true;
  }

  function tryTile(q, mask, minIn, region) {
    // Refuse les formes vrillées ou trop fines (sur les lignes de crête).
    var area = 0, sgn = 0;
    for (var e = 0; e < 4; e++) {
      var p0 = q[e], p1 = q[(e + 1) % 4], p2 = q[(e + 2) % 4];
      area += p0[0] * p1[1] - p1[0] * p0[1];
      var cr = (p1[0] - p0[0]) * (p2[1] - p1[1]) - (p1[1] - p0[1]) * (p2[0] - p1[0]);
      var sg = cr > 0 ? 1 : -1;
      if (sgn && sg !== sgn) return false;
      sgn = sg;
    }
    if (Math.abs(area) / 2 < ROW * ROW * 0.22) return false;
    for (var e2 = 0; e2 < 4; e2++) if (Math.hypot(q[(e2 + 1) % 4][0] - q[e2][0], q[(e2 + 1) % 4][1] - q[e2][1]) > ROW * 2.8) return false;
    // Échantillonne la tesselle : elle doit être dans sa zone et ne chevaucher personne.
    var inside = 0, free = 0, total = 0;
    for (var u = 0.15; u < 0.9; u += 0.35) {
      for (var v = 0.2; v < 0.9; v += 0.3) {
        var x = (q[0][0] * (1 - u) + q[1][0] * u) * (1 - v) + (q[3][0] * (1 - u) + q[2][0] * u) * v;
        var y = (q[0][1] * (1 - u) + q[1][1] * u) * (1 - v) + (q[3][1] * (1 - u) + q[2][1] * u) * v;
        var gx = (x / G) | 0, gy = (y / G) | 0;
        total++;
        if (gx < 0 || gy < 0 || gx >= gw || gy >= gh) continue;
        if (mask[gy * gw + gx]) inside++;
        if (!occ[gy * gw + gx]) free++;
      }
    }
    if (inside < total * minIn || free < total * 0.9) return false;
    var minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    q.forEach(function (p) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
    for (var gy2 = Math.max(0, (miny / G) | 0); gy2 <= Math.min(gh - 1, (maxy / G) | 0); gy2++) {
      for (var gx2 = Math.max(0, (minx / G) | 0); gx2 <= Math.min(gw - 1, (maxx / G) | 0); gx2++) {
        if (inQuad(q, (gx2 + .5) * G, (gy2 + .5) * G)) occ[gy2 * gw + gx2] = 1;
      }
    }
    var cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4, cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
    pieces.push({ q: q, c: [cx, cy], kind: region });
    return true;
  }

  function jitter(q, amt) {
    return q.map(function (p) { return [p[0] + (R() - .5) * 2 * amt, p[1] + (R() - .5) * 2 * amt]; });
  }

  // Pose des rangées de tesselles le long des courbes de niveau d'une zone :
  // c'est l'« andamento » des mosaïstes, les rangées épousent la forme.
  function layRows(mask, D, region, lenK) {
    var maxD = 0;
    for (var i = 0; i < D.length; i++) if (D[i] > maxD) maxD = D[i];
    var gap = ROW * 0.17, half = ROW / 2 - gap / 2;
    for (var level = ROW * 0.5; level < maxD; level += ROW) {
      var lines = contours(D, gw, gh, level);
      lines.forEach(function (line) {
        var p = smooth(line), n = p.length;
        if (n < 3) return;
        var acc = [0];
        for (var i = 1; i < n; i++) acc.push(acc[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
        if (line.closed) acc.push(acc[n - 1] + Math.hypot(p[0][0] - p[n - 1][0], p[0][1] - p[n - 1][1]));
        var len = acc[acc.length - 1];
        if (len < ROW * 0.7) return;
        function at(s) {
          s = line.closed ? ((s % len) + len) % len : clamp(s, 0, len);
          var lo = 0, hi = acc.length - 1;
          while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (acc[mid] <= s) lo = mid; else hi = mid; }
          var a = p[lo % n], b = p[hi % n], seg = acc[hi] - acc[lo] || 1, t = (s - acc[lo]) / seg;
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
        }
        function normal(s) {
          var a = at(s - ROW * 0.4), b = at(s + ROW * 0.4), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
          return [-dy / l, dx / l];
        }
        var s = line.closed ? R() * ROW : 0;
        var end = line.closed ? s + len : len;
        while (s < end - ROW * 0.35) {
          var L = ROW * lenK * (0.7 + R() * 0.6);
          var e = Math.min(s + L, end);
          var sa = s + gap / 2, sb = e - gap / 2;
          if (sb - sa > ROW * 0.3) {
            var A = at(sa), B = at(sb), na = normal(sa), nb = normal(sb);
            var ha = half * (0.9 + R() * 0.12), hb = half * (0.9 + R() * 0.12);
            var q = jitter([
              [A[0] + na[0] * ha, A[1] + na[1] * ha], [B[0] + nb[0] * hb, B[1] + nb[1] * hb],
              [B[0] - nb[0] * hb, B[1] - nb[1] * hb], [A[0] - na[0] * ha, A[1] - na[1] * ha]
            ], ROW * 0.1);
            tryTile(q, mask, 0.7, region);
          }
          s = e;
        }
      });
    }
  }

  // Bouche les trous restants avec de petites tesselles taillées sur mesure.
  function fillGaps(mask, D, region) {

    for (var j = 0; j < flying.length; j++) {
      var f = flying[j], tt = time - f.delay;
      if (tt <= f.dur) drawFlying(f, tt / f.dur, -1); else drawFlying(f, 1, (tt - f.dur) / IMPACT);
    }
    if (time < info.total + 300) requestAnimationFrame(frame);
    else { running = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0); }
  }

  function play() {
    drawBase();
    pieces.forEach(function (p) { p.placed = false; });
    photoSlots.forEach(function (s) { s.done = 0; });
    if (reduceMotion) {
      bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      pieces.forEach(function (p) { placeOnBed(p); p.placed = true; });
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bed, 0, 0);
      return;
    }
    t0 = performance.now();
    if (!running) { running = true; requestAnimationFrame(frame); }
  }

  function count() {
    document.getElementById('nb-pieces').textContent = pieces.length.toLocaleString('fr-FR') + ' pièces';
    window.__count = pieces.length;
  }
  document.getElementById('rejouer').addEventListener('click', play);
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); play(); }
  });
  var timer, lastW = 0, lastH = 0, started = false;
  window.addEventListener('resize', function () {
    if (!started) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 60) return;
      lastW = window.innerWidth; lastH = window.innerHeight;
      build(); play(); count();
    }, 250);
  });

  function loadImg(ch) {
    return new Promise(function (res) {
      var im = new Image();
      im.onload = function () { imgs[ch] = im; res(); };
      im.onerror = function () { res(); };
      im.src = PHOTOS[ch].src;
    });
  }
  var fontReady = document.fonts && document.fonts.load ? document.fonts.load('100px "Titan One"').catch(function () {}) : Promise.resolve();
  Promise.all([fontReady, loadImg('G'), loadImg('A')]).then(function () {
    started = true; lastW = window.innerWidth; lastH = window.innerHeight;
    build(); play(); count();
  });
})();
</script>
