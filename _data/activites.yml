# ============================================================
#  Catalogue de vos activités
#  Pour ajouter une activité : copiez un bloc qui commence par
#  "- titre:" et collez-le en dessous, puis modifiez-le.
#  Attention : gardez bien les mêmes espaces en début de ligne.
#
#  titre       : nom de l'activité
#  categorie   : sert aux boutons de filtre (ex : Sport, Création…)
#  periode     : texte libre (ex : "2024", "Depuis 2019")
#  image       : nom d'un fichier du dossier assets/images
#  description : une ou deux phrases
#  Astuce : mettez les textes entre guillemets "…" (obligatoire
#  s'ils contiennent le signe « : »).
#  lien        : (facultatif) une adresse web ou un article du blog
# ============================================================

- titre: Randonnée en montagne
